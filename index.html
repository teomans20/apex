<script>
  // Otomatik güncelleme: yeni sürüm yüklendiğinde önbelleği atla
  // Sayfa her açıldığında kendini "taze" çekmeye zorlar (PWA cache sorununu çözer)
  (function() {
    try {
      // Service worker varsa temizle (eski PWA önbelleği)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }
      // Eski cache'leri temizle
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        }).catch(function(){});
      }
    } catch (e) {}
  })();
</script>

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; overscroll-behavior: none; -webkit-font-smoothing: antialiased; min-height: 100vh; padding-top: env(safe-area-inset-top); }

  input { font-size: 16px; }

  .day-card { transition: transform 0.15s ease, box-shadow 0.35s ease; box-shadow: 0 0 12px var(--glow-low, transparent); }
  .day-card:active { transform: scale(0.97); box-shadow: 0 0 40px var(--glow-high, transparent), 0 10px 60px var(--glow-high, transparent); transition: transform 0.15s ease, box-shadow 0.12s ease; }
  .exercise-btn:active, .cal-cell:active { background: rgba(255,255,255,0.05) !important; }
  .add-btn:active, .submit-btn:not(:disabled):active { transform: scale(0.98); }
  .tab-btn:active { transform: scale(0.95); }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .dragging { z-index: 1000; transition: none !important; pointer-events: none; box-shadow: 0 12px 40px rgba(0,0,0,0.6); transform: scale(1.04); opacity: 0.95; }
  .pr-overlay { animation: prFadeIn 0.4s ease-out; }
  @keyframes prFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .pr-content { animation: prPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes prPop { 0% { transform: scale(0.3) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .confetti { position: absolute; width: 8px; height: 14px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  .period-btn { transition: all 0.15s; }
  .period-btn.active { background: #fff !important; color: #000 !important; }
  .toast { animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2s forwards; }
  @keyframes toastIn { from { transform: translateY(80px) translateX(-50%); opacity: 0; } to { transform: translateY(0) translateX(-50%); opacity: 1; } }
  @keyframes toastOut { to { transform: translateY(80px) translateX(-50%); opacity: 0; } }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes apexPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.75; } }
  /* ————— ONBOARDING (Hoş Geldin) ————— */
  @keyframes obFloat1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(36px,44px) scale(1.15); } }
  @keyframes obFloat2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-36px,-36px) scale(1.2); } }
  @keyframes obPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.5; } }
  @keyframes obShine { 0% { left: -60%; } 55%,100% { left: 140%; } }
  @keyframes obBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes obSheen { 0% { left: -60%; } 55%,100% { left: 130%; } }
  @keyframes obSlideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .ob-glow1 { animation: obFloat1 9s ease-in-out infinite; }
  .ob-glow2 { animation: obFloat2 11s ease-in-out infinite; }
  .ob-halo { animation: obPulse 3s ease-in-out infinite; }
  .ob-halo2 { animation: obPulse 3s ease-in-out infinite 0.6s; }
  .ob-shine { animation: obShine 3.6s ease-in-out infinite; }
  .ob-chip1 { animation: obBob 3.4s ease-in-out infinite; }
  .ob-chip2 { animation: obBob 3.4s ease-in-out infinite 1.1s; }
  .ob-sheen { animation: obSheen 3.2s ease-in-out infinite; }
  .ob-slide-anim { animation: obSlideIn 0.55s cubic-bezier(.2,.7,.3,1); }
  /* ————— TEMA DEĞİŞKENLERİ (varsayılan: APEX kırmızı) ————— */
  :root {
    --accent: #FF3D3D;
    --accent-dark: #c62828;
    --accent-deep: #8b1a1a;
    --accent-light: #FF6B6B;
    --accent-rgb: 255,61,61;
  }

  /* ————— FAZ 1: NATIVE HİS ————— */
  /* Modal animasyonları: overlay fade + içerik slide-up */
  @keyframes apexFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes apexSlideUp { from { transform: translateY(28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes apexScaleIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .apex-overlay-anim { animation: apexFadeIn 0.18s ease-out; }
  .apex-modal-anim { animation: apexSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1); }
  .apex-scale-anim { animation: apexScaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
  /* Buton basma tepkisi: tüm button'lara evrensel */
  button { transition: transform 0.1s ease, opacity 0.1s ease; }
  button:active { transform: scale(0.955); }
  /* Tab sayfa geçişi */
  @keyframes apexPageIn { from { transform: translateX(14px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .apex-page-anim { animation: apexPageIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
  /* Kart giriş animasyonu (liste elemanları) */
  @keyframes apexCardIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .apex-card-anim { animation: apexCardIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
  /* Skeleton yükleme parıltısı */
  @keyframes apexShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes apexSlide { 0% { transform: translateX(-130%); } 100% { transform: translateX(330%); } }
  #root { min-height: 100vh; }
  /* Telefon yatay tutulduğunda içeriği zorla dik göster (iOS PWA orientation lock desteklemediği için) */
  @media screen and (orientation: landscape) and (max-width: 950px) {
    #root {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh;
      height: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
      position: absolute;
      top: 100vw;
      left: 0;
    }
  }

const hexToRgb = hex => {
  const h = hex.replace('#', '');
  return {
    r: parseInt(h.slice(0, 2), 16),
    g: parseInt(h.slice(2, 4), 16),
    b: parseInt(h.slice(4, 6), 16)
  };
};

// Build a full day config object from a base accent + dark color
const buildDayConfig = (name, subtitle, accent, dark) => {
  const {
    r,
    g,
    b
  } = hexToRgb(accent);
  return {
    name: name.toUpperCase(),
    subtitle: subtitle || '',
    accent,
    accentSoft: `rgba(${r},${g},${b},0.15)`,
    gradient: `linear-gradient(135deg,${accent},${dark})`,
    glowLow: `rgba(${r},${g},${b},0.08)`,
    glowHigh: `rgba(${r},${g},${b},0.55)`
  };
};

// Merge built-in days with user's custom days into a single config map
const buildDayConfigMap = (customDays, hiddenDays, dayOverrides) => {
  const hidden = hiddenDays || [];
  const ov = dayOverrides || {};
  const map = {};
  // Yerleşik günler — gizlenmemiş olanlar (varsa override uygula, yoksa dile göre çevir)
  Object.keys(BUILTIN_DAYS).forEach(k => {
    if (!hidden.includes(k)) {
      const base = BUILTIN_DAYS[k];
      if (ov[k]) {
        map[k] = buildDayConfig(ov[k].name || base.name, ov[k].subtitle != null ? ov[k].subtitle : base.subtitle, ov[k].accent || base.accent, ov[k].dark || base.accent);
      } else {
        // dile göre isim/alt başlık (override yoksa)
        const trName = (typeof t === 'function') ? t('day_' + k) : base.name;
        const trSub = (typeof t === 'function') ? t('day_' + k + '_sub') : base.subtitle;
        map[k] = { ...base, name: trName, subtitle: trSub };
      }
    }
  });
  (customDays || []).forEach(cd => {
    if (!hidden.includes(cd.id)) map[cd.id] = buildDayConfig(cd.name, cd.subtitle, cd.accent, cd.dark);
  });
  return map;
};

// Resolve an exercise name to its muscle contributions.
// Returns null if unknown (so user can be asked to tag it).
const getExerciseMuscles = (exerciseName, customMap) => {
  // 1) User-defined override takes priority
  if (customMap && customMap[exerciseName]) return customMap[exerciseName];
  const lower = exerciseName.toLowerCase().trim();
  // 2) Try exact-ish substring matches, longest match wins
  let best = null,
    bestLen = 0;
  for (const entry of EXERCISE_MUSCLE_MAP) {
    for (const term of entry.match) {
      if (lower.includes(term) && term.length > bestLen) {
        best = entry.muscles;
        bestLen = term.length;
      }
    }
  }
  return best; // null if nothing matched
};

// ————— KASA (kimliğe göre veri izolasyonu) —————
// Her kimlik (kullanıcı / misafir / legacy) kendi kasasında saklanır.
// legacy-unassigned = mevcut ÇIPLAK anahtarlar (eski sürümden gelen veri burada durur, asla silinmez).
// u_{uid} / guest kasaları: base + '::' + kasaId.  Dil/tema/birim asla kasalanmaz (cihaz geneli).
let CURRENT_VAULT = 'legacy-unassigned';
try { if (localStorage.getItem('apex-guest') === '1') CURRENT_VAULT = 'guest'; } catch (e) {}
function computeVaultId(uid, guest) {
  if (uid) return 'u_' + uid;
  if (guest) return 'guest';
  return 'legacy-unassigned';
}
function setCurrentVault(id) { CURRENT_VAULT = id || 'legacy-unassigned'; }
// Kasa anahtarı: legacy ise çıplak base (geri uyumluluk), değilse base::kasaId
function vk(base) {
  return CURRENT_VAULT === 'legacy-unassigned' ? base : base + '::' + CURRENT_VAULT;
}
// Bir kasadan diğerine tüm veri anahtarlarını KOPYALA (asla silme). Hedef doluysa dokunma.
const VAULT_BASE_KEYS = [GYMS_KEY, ACTIVE_GYM_KEY, 'apex-measurements', 'apex-goals', 'apex-exercise-notes', 'apex-timer-settings', 'apex-timer-per-exercise'];
function _keyForVault(base, vaultId) {
  return vaultId === 'legacy-unassigned' ? base : base + '::' + vaultId;
}
function copyVault(fromVault, toVault) {
  if (fromVault === toVault) return;
  try {
    // Kopyalanacak base anahtarları topla (salon verisi dahil: STORAGE_KEY + STORAGE_KEY__*)
    const bases = VAULT_BASE_KEYS.slice();
    const suffix = fromVault === 'legacy-unassigned' ? '' : '::' + fromVault;
    // Kaynak kasadaki tüm salon-veri anahtarlarını bul
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      let bare = k;
      if (suffix) {
        if (!k.endsWith(suffix)) continue;
        bare = k.slice(0, -suffix.length);
      } else if (k.indexOf('::') !== -1) {
        continue; // legacy kaynakta kasalı anahtarları atla
      }
      if (bare === STORAGE_KEY || bare.startsWith(STORAGE_KEY + '__')) {
        if (bases.indexOf(bare) === -1) bases.push(bare);
      }
    }
    // Şimdi kopyala (indeks kaymasını önlemek için önce topladık)
    bases.forEach(bare => {
      const src = _keyForVault(bare, fromVault);
      const dst = _keyForVault(bare, toVault);
      if (src === dst) return;
      const val = localStorage.getItem(src);
      if (val === null) return;
      if (localStorage.getItem(dst) !== null) return; // hedef dolu → ezme
      localStorage.setItem(dst, val);
    });
  } catch (e) {}
}

function claimLegacyForUser(uid) {
  try {
    if (!uid) return;
    if (localStorage.getItem('apex-legacy-claimed')) return;
    copyVault('legacy-unassigned', 'u_' + uid);
    localStorage.setItem('apex-legacy-claimed', uid);
  } catch (e) {}
}

}

// ————— BULUT YEDEK: yerel-özel veriler (local_profile_v1) —————
// Ölçü, hedef, egzersiz notları, timer tercihleri → users/{uid}/data/local_profile_v1
// Push: mutasyon sonrası (debounced). Restore: login sonrası tek sefer.
// Restore ASLA dolu kasa slotunu ezmez (copyVault ile aynı felsefe).
const LOCAL_PROFILE_KEYS = ['apex-measurements', 'apex-goals', 'apex-exercise-notes', 'apex-timer-settings', 'apex-timer-per-exercise'];
function _readVaultProfile() {
  const out = {};
  LOCAL_PROFILE_KEYS.forEach(base => {
    try {
      const raw = localStorage.getItem(vk(base));
      if (raw !== null) out[base] = raw;
    } catch (e) {}
  });
  return out;
}
let _pushTimer = null;
function pushLocalProfile() {
  // Yalnızca girişli kullanıcı + Firebase varsa; kimlik yoksa sessiz atla
  if (_pushTimer) { clearTimeout(_pushTimer); _pushTimer = null; }
  _pushTimer = setTimeout(() => {
    _pushTimer = null;
    try {
      const uid = window.APEX_CURRENT_UID;
      if (!uid || !window.APEX_DB) return;
      const snap = _readVaultProfile();
      if (Object.keys(snap).length === 0) return; // yazacak bir şey yok
      snap.savedAt = Date.now();
      window.APEX_DB.collection('users').doc(uid).collection('data').doc('local_profile_v1')
        .set(snap).catch(() => {}); // hata sessiz — bir sonraki mutasyon tekrar dener
    } catch (e) {}
  }, 1200);
}
// Login sonrası: buluttan çek, kasadaki BOŞ slotları doldur (dolu olanı ezme).
// Bulutta yoksa AMA yerelde varsa (ör. yeni signup + guest göçü) → hemen buluta itele.
function restoreLocalProfile(uid, onDone) {
  try {
    if (!uid || !window.APEX_DB) { if (onDone) onDone(false); return; }
    window.APEX_DB.collection('users').doc(uid).collection('data').doc('local_profile_v1').get()
      .then(snap => {
        let filled = false;
        if (snap.exists) {
          const d = snap.data() || {};
          LOCAL_PROFILE_KEYS.forEach(base => {
            const val = d[base];
            if (val == null || val === '') return;
            try {
              const cur = localStorage.getItem(vk(base));
              if (cur === null || cur === '' || cur === '{}' || cur === '[]') {
                localStorage.setItem(vk(base), val);
                filled = true;
              }
            } catch (e) {}
          });
        } else {
          // Bulutta yok — yerelde varsa (guest göçü sonrası) hemen buluta itele
          const cur = _readVaultProfile();
          if (Object.keys(cur).length > 0) pushLocalProfile();
        }
        if (onDone) onDone(filled);
      })
      .catch(() => { if (onDone) onDone(false); });
  } catch (e) { if (onDone) onDone(false); }
}

// ————— DİNLENME ZAMANLAYICISI AYARLARI —————
// localStorage: apex-timer-settings = { enabled, defaultSec, vibrate }
// localStorage: apex-timer-per-exercise = { "Bench Press": 180, "Curl": 60, ... }
const TIMER_SETTINGS_KEY = 'apex-timer-settings';
const TIMER_PEREX_KEY = 'apex-timer-per-exercise';
function loadTimerSettings() {
  try {
    const raw = localStorage.getItem(vk(TIMER_SETTINGS_KEY));
    if (raw) { const s = JSON.parse(raw); return { enabled: s.enabled !== false, defaultSec: s.defaultSec || 90, vibrate: s.vibrate !== false }; }
  } catch (e) {}
  return { enabled: true, defaultSec: 90, vibrate: true };
}
function saveTimerSettings(s) {
  try { localStorage.setItem(vk(TIMER_SETTINGS_KEY), JSON.stringify(s)); } catch (e) {}
  try { pushLocalProfile(); } catch (e) {}
}
function loadTimerPerExercise() {
  try { const raw = localStorage.getItem(vk(TIMER_PEREX_KEY)); if (raw) return JSON.parse(raw); } catch (e) {}
  return {};
}
function saveTimerPerExercise(map) {
  try { localStorage.setItem(vk(TIMER_PEREX_KEY), JSON.stringify(map)); } catch (e) {}
  try { pushLocalProfile(); } catch (e) {}
}

// ————— EGZERSİZ NOTLARI (o güne + egzersize özel) —————
// localStorage: apex-exercise-notes = { "2026-07-11|Bench Press": "not...", ... }
const EX_NOTES_KEY = 'apex-exercise-notes';
function loadExerciseNotes() {
  try { const raw = localStorage.getItem(vk(EX_NOTES_KEY)); if (raw) return JSON.parse(raw); } catch (e) {}
  return {};
}
function noteKey(dayKey, name) { return dayKey + '|' + name; }
function getExerciseNote(dayKey, name) {
  const notes = loadExerciseNotes();
  return notes[noteKey(dayKey, name)] || '';
}
function saveExerciseNote(dayKey, name, text) {
  const notes = loadExerciseNotes();
  const k = noteKey(dayKey, name);
  if (text && text.trim()) notes[k] = text.trim();
  else delete notes[k];
  try { localStorage.setItem(vk(EX_NOTES_KEY), JSON.stringify(notes)); } catch (e) {}
  try { pushLocalProfile(); } catch (e) {}
}

// Kullanıcı adını normalize et: küçük harf, sadece harf/rakam/alt çizgi
function normalizeUsername(raw) {
  return (raw || '').toLowerCase().trim().replace(/[^a-z0-9_]/g, '').slice(0, 20);
}

// Kullanıcı adı geçerli mi? (3-20 karakter)
function isValidUsername(u) {
  const n = normalizeUsername(u);
  return n.length >= 3 && n.length <= 20;
}

// Kullanıcı adı müsait mi? Döner: 'available' | 'taken' | 'error'
async function isUsernameAvailable(username) {
  const u = normalizeUsername(username);
  if (!window.APEX_DB) return 'error';
  try {
    const snap = await window.APEX_DB.collection('usernames').doc(u).get();
    return snap.exists ? 'taken' : 'available';
  } catch (e) {
    // Kontrol edilemedi (izin/ağ) — "alınmış" deme, "error" de
    return 'error';
  }
}

// Kullanıcı adını sahiplen: usernames/{username} = {uid}, users/{uid}.username = username
async function claimUsername(uid, username) {
  const u = normalizeUsername(username);
  if (!window.APEX_DB) throw new Error('no-db');
  // usernames koleksiyonuna yaz (benzersizlik için)
  await window.APEX_DB.collection('usernames').doc(u).set({
    uid: uid,
    createdAt: Date.now()
  });
  // users dokümanına da ekle
  await window.APEX_DB.collection('users').doc(uid).set({
    username: u
  }, {
    merge: true
  });
  return u;
}

// Bir kullanıcının username'i var mı? (users/{uid}.username)
async function getMyUsername(uid) {
  if (!window.APEX_DB) return null;
  try {
    const snap = await window.APEX_DB.collection('users').doc(uid).get();
    if (snap.exists && snap.data().username) return snap.data().username;
  } catch (e) {}
  return null;
}

// Kullanıcı adından kullanıcı bul (arkadaş eklemek için)
async function findUserByUsername(username) {
  const u = normalizeUsername(username);
  if (!window.APEX_DB || !u) return null;
  try {
    const unameSnap = await window.APEX_DB.collection('usernames').doc(u).get();
    if (!unameSnap.exists) return null;
    const uid = unameSnap.data().uid;
    const userSnap = await window.APEX_DB.collection('users').doc(uid).get();
    if (!userSnap.exists) return null;
    const d = userSnap.data();
    return {
      uid: uid,
      username: u,
      name: d.name || t('apex_user')
    };
  } catch (e) {
    return null;
  }
}

// Veri modeli:
//   users/{uid}/friends/{friendUid}     → { username, name, since }  (kabul edilmiş)
//   users/{uid}/friendRequests/{fromUid}→ { username, name, at }     (gelen istek)
//   users/{uid}/sentRequests/{toUid}    → { username, name, at }     (gönderilen istek)

// Arkadaşlık isteği gönder
async function sendFriendRequest(me, target) {
  // me: {uid, username, name}, target: {uid, username, name}
  if (!window.APEX_DB) throw new Error('no-db');
  if (!me.uid || !me.username) throw new Error('kullanıcı-adın-yok');
  if (!target.uid || !target.username) throw new Error('hedef-eksik');
  if (me.uid === target.uid) throw new Error('kendine-istek');
  const now = Date.now();
  // Karşı tarafın "gelen istekler"ine beni yaz
  await window.APEX_DB.collection('users').doc(target.uid).collection('friendRequests').doc(me.uid).set({
    username: me.username || '',
    name: me.name || '',
    at: now
  });
  // Benim "gönderilenler"ime onu yaz
  await window.APEX_DB.collection('users').doc(me.uid).collection('sentRequests').doc(target.uid).set({
    username: target.username || '',
    name: target.name || '',
    at: now
  });
}

// Gelen isteği kabul et
async function acceptFriendRequest(me, fromUid, fromInfo) {
  if (!window.APEX_DB) throw new Error('no-db');
  const now = Date.now();
  // İki tarafa da arkadaşlık yaz
  await window.APEX_DB.collection('users').doc(me.uid).collection('friends').doc(fromUid).set({
    username: fromInfo.username,
    name: fromInfo.name || '',
    since: now
  });
  await window.APEX_DB.collection('users').doc(fromUid).collection('friends').doc(me.uid).set({
    username: me.username,
    name: me.name || '',
    since: now
  });
  // TÜM istek izlerini temizle (çift yönlü istek durumu dahil — 4 olası kayıt)
  // 1) Karşıdan bana gelen istek
  await window.APEX_DB.collection('users').doc(me.uid).collection('friendRequests').doc(fromUid).delete().catch(() => {});
  // 2) Karşının "bana gönderdim" kaydı
  await window.APEX_DB.collection('users').doc(fromUid).collection('sentRequests').doc(me.uid).delete().catch(() => {});
  // 3) Benim karşıya gönderdiğim istek (çift yönlü durumda kalmıştı)
  await window.APEX_DB.collection('users').doc(me.uid).collection('sentRequests').doc(fromUid).delete().catch(() => {});
  // 4) Karşının "benden gelen istek" kaydı
  await window.APEX_DB.collection('users').doc(fromUid).collection('friendRequests').doc(me.uid).delete().catch(() => {});
}

// Gelen isteği reddet/sil
async function rejectFriendRequest(myUid, fromUid) {
  if (!window.APEX_DB) throw new Error('no-db');
  await window.APEX_DB.collection('users').doc(myUid).collection('friendRequests').doc(fromUid).delete();
  await window.APEX_DB.collection('users').doc(fromUid).collection('sentRequests').doc(myUid).delete();
}

// Gönderilen isteği iptal et
async function cancelFriendRequest(myUid, toUid) {
  if (!window.APEX_DB) throw new Error('no-db');
  await window.APEX_DB.collection('users').doc(myUid).collection('sentRequests').doc(toUid).delete();
  await window.APEX_DB.collection('users').doc(toUid).collection('friendRequests').doc(myUid).delete();
}

// Arkadaşı çıkar
async function removeFriend(myUid, friendUid) {
  if (!window.APEX_DB) throw new Error('no-db');
  await window.APEX_DB.collection('users').doc(myUid).collection('friends').doc(friendUid).delete();
  await window.APEX_DB.collection('users').doc(friendUid).collection('friends').doc(myUid).delete();
}

// Arkadaş listesini çek
async function loadFriends(uid) {
  if (!window.APEX_DB) return [];
  try {
    const snap = await window.APEX_DB.collection('users').doc(uid).collection('friends').get();
    return snap.docs.map(d => ({
      uid: d.id,
      ...d.data()
    }));
  } catch (e) {
    return [];
  }
}

// ————— PROGRAM PAYLAŞIMI —————
// Model: users/{alıcı}/programRequests/{istekId} → { fromUid, fromName, dayName, exercises, createdAt }
// Bir günün egzersizlerini (ağırlıksız/setsiz — sadece isimler) arkadaşlara gönder
async function sendProgram(fromUid, fromName, toUids, dayName, exercises) {
  if (!window.APEX_DB || !toUids || toUids.length === 0) return;
  const cleanExercises = (exercises || []).filter(Boolean);
  await Promise.all(toUids.map(async toUid => {
    const reqId = fromUid + '_' + Date.now().toString(36);
    try {
      await window.APEX_DB.collection('users').doc(toUid).collection('programRequests').doc(reqId).set({
        fromUid: fromUid,
        fromName: fromName || 'Biri',
        dayName: dayName || 'Program',
        exercises: cleanExercises,
        createdAt: Date.now()
      });
    } catch (e) {}
  }));
}
// Gelen program isteklerini çek
async function loadProgramRequests(uid) {
  if (!window.APEX_DB) return [];
  try {
    const snap = await window.APEX_DB.collection('users').doc(uid).collection('programRequests').get();
    return snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  } catch (e) {
    return [];
  }
}
// Program isteğini reddet/sil
async function dismissProgramRequest(uid, reqId) {
  if (!window.APEX_DB) return;
  try {
    await window.APEX_DB.collection('users').doc(uid).collection('programRequests').doc(reqId).delete();
  } catch (e) {}
}

  if (!window.APEX_DB) return;
  // Günde 1 kez: bugün zaten gönderdiysem tekrar gönderme
  const todayKey = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  try {
    if (localStorage.getItem('apex-gym-notified') === todayKey) return;
  } catch (e) {}
  try {
    const friends = await loadFriends(fromUid);
    if (!friends || friends.length === 0) { localStorage.setItem('apex-gym-notified', todayKey); return; }
    const id = 'gym_' + fromUid + '_' + todayKey.replace(/-/g, ''); // gün başına sabit id (aynı gün üzerine yazar, çoğaltmaz)
    await Promise.all(friends.map(fr =>
      window.APEX_DB.collection('users').doc(fr.uid).collection('notifications').doc(id).set({
        type: 'gym',
        fromUid: fromUid,
        fromName: fromName || t('friend_word'),
        message: t('in_workout_status'),
        createdAt: Date.now(),
        read: false
      }).catch(() => {})
    ));
    localStorage.setItem('apex-gym-notified', todayKey);
  } catch (e) {}
}

// Bir tarihin ait olduğu haftanın Pazartesi 00:00'ını döndürür (Pzt–Paz, Pazar dahil)
function weekMondayStart(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay(); // 0=Paz, 1=Pzt ... 6=Cmt
  const diff = day === 0 ? 6 : day - 1;
  d.setDate(d.getDate() - diff);
  return d.getTime();
}

// Belirli bir hafta için özet hesapla (mondayTs = o haftanın Pazartesi 00:00)
function computeWeekSummary(data, mondayTs) {
  const logs = data.logs || [];
  const sessions = data.sessions || [];
  const weekStart = mondayTs;
  const weekEnd = mondayTs + 7 * 86400000; // ertesi Pzt 00:00 (Pazar 23:59 dahil)
  const prevStart = mondayTs - 7 * 86400000;
  const inWeek = (ts, s, e) => ts >= s && ts < e;

  const weekLogs = logs.filter(l => inWeek(l.timestamp, weekStart, weekEnd));
  const prevLogs = logs.filter(l => inWeek(l.timestamp, prevStart, weekStart));
  if (weekLogs.length === 0) return null;

  const dayKeysOf = ls => new Set(ls.map(l => dateKey(l.timestamp)));
  const workoutCount = dayKeysOf(weekLogs).size;
  const prevWorkoutCount = dayKeysOf(prevLogs).size;

  // Hangi günler (Pzt=0 ... Paz=6)
  const dayFlags = [false, false, false, false, false, false, false];
  weekLogs.forEach(l => {
    const d = new Date(l.timestamp);
    const idx = d.getDay() === 0 ? 6 : d.getDay() - 1;
    dayFlags[idx] = true;
  });

  // Rekor sayısı (o hafta kırılan) + en iyi rekor
  // Optimizasyon: logları egzersize göre BİR KEZ grupla (her egzersiz için tüm logları tekrar filtrelemek yerine)
  const logsByEx = {};
  logs.forEach(l => { (logsByEx[l.exerciseName] = logsByEx[l.exerciseName] || []).push(l); });
  // her egzersiz için günlük top set dizisini önceden hazırla
  const daysByEx = {};
  Object.keys(logsByEx).forEach(name => {
    const byDay = {};
    logsByEx[name].forEach(l => { const k = dateKey(l.timestamp); if (!byDay[k] || l.timestamp < byDay[k].timestamp) byDay[k] = l; });
    daysByEx[name] = Object.values(byDay).sort((a, b) => a.timestamp - b.timestamp);
  });
  const countPRs = (targetLogs) => {
    const exNames = [...new Set(targetLogs.map(l => l.exerciseName))];
    let prs = 0;
    const best = {};
    exNames.forEach(name => {
      const days = daysByEx[name] || [];
      let runningBest = 0;
      days.forEach(d => {
        if (d.weight > runningBest) {
          if (inWeek(d.timestamp, weekStart, weekEnd)) {
            prs++;
            const gain = runningBest > 0 ? d.weight - runningBest : 0;
            if (!best[name] || gain > best[name].gain) best[name] = { name, weight: d.weight, reps: d.reps, gain };
          }
          runningBest = d.weight;
        }
      });
    });
    return { count: prs, bestMap: best };
  };
  const weekPR = countPRs(weekLogs);
  const prCount = weekPR.count;
  const prevPrCount = countPRs(prevLogs).count;

  let bestPR = null;
  Object.values(weekPR.bestMap).forEach(p => { if (!bestPR || p.gain > bestPR.gain) bestPR = p; });

  // Toplam süre (dakika)
  const sumMinutes = (s, e) => sessions
    .filter(ss => ss.startTime && ss.endTime && inWeek(ss.startTime, s, e))
    .reduce((sum, ss) => sum + Math.max(0, Math.round((ss.endTime - ss.startTime) / 60000)), 0);
  const totalMin = sumMinutes(weekStart, weekEnd);
  const prevMin = sumMinutes(prevStart, weekStart);

  // Kas dağılımı (ilk 4, %100 normalize) + en çok çalışılan
  const muscleVol = {};
  weekLogs.forEach(l => {
    const muscles = getExerciseMuscles(l.exerciseName, data.customMuscleMap);
    if (muscles && typeof muscles === 'object') {
      const weights = Object.entries(muscles);
      const totalW = weights.reduce((s, [, w]) => s + w, 0);
      if (totalW > 0) {
        const vol = (l.weight || 0) * (l.reps || 0);
        weights.forEach(([m, w]) => { muscleVol[m] = (muscleVol[m] || 0) + vol * (w / totalW); });
      }
    }
  });
  // Trapez'i Sırt (lat) ile birleştir — ikisi de sırt kası, ayrı sayılınca dağılım yanıltıcı oluyor
  if (muscleVol.traps) { muscleVol.lats = (muscleVol.lats || 0) + muscleVol.traps; delete muscleVol.traps; }
  // Birleşik grup için Türkçe ad
  const muscleTr = code => code === 'lats' ? t('muscle_lats') : (MUSCLES[code] ? t('muscle_'+code) : code);
  const totalMuscleVol = Object.values(muscleVol).reduce((a, b) => a + b, 0);
  let muscleDist = [], topMuscle = null;
  if (totalMuscleVol > 0) {
    const sortedM = Object.entries(muscleVol).sort((a, b) => b[1] - a[1]);
    topMuscle = muscleTr(sortedM[0][0]);
    const top4 = sortedM.slice(0, 4);
    const sum4 = top4.reduce((s, [, v]) => s + v, 0);
    muscleDist = top4.map(([m, v]) => ({ muscle: muscleTr(m), pct: Math.round(v / sum4 * 100) }));
    const diff = 100 - muscleDist.reduce((s, m) => s + m.pct, 0);
    if (diff !== 0 && muscleDist.length > 0) {
      let maxI = 0; muscleDist.forEach((m, i) => { if (m.pct > muscleDist[maxI].pct) maxI = i; });
      muscleDist[maxI].pct += diff;
    }
  }

  // En uzun ardışık gün serisi (bu hafta içinde)
  let streak = 0, maxStreak = 0;
  for (let i = 0; i < 7; i++) {
    if (dayFlags[i]) { streak++; maxStreak = Math.max(maxStreak, streak); } else streak = 0;
  }

  // Atasözü — haftaya göre sabit
  const wk = new Date(mondayTs);
  const seed = wk.getFullYear() * 53 + Math.floor((mondayTs - new Date(wk.getFullYear(), 0, 1).getTime()) / (7 * 86400000));
  const proverb = WEEKLY_PROVERBS[((seed % WEEKLY_PROVERBS.length) + WEEKLY_PROVERBS.length) % WEEKLY_PROVERBS.length];

  const fmt = ts => { const d = new Date(ts); return d.getDate() + ' ' + ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'][d.getMonth()]; };
  const rangeText = (fmt(weekStart) + ' – ' + fmt(weekEnd - 86400000)).toUpperCase();

  const cmp = (cur, prev) => {
    if (prev === 0 && cur > 0) return { dir: 'up', diff: cur };
    if (cur > prev) return { dir: 'up', diff: cur - prev };
    if (cur < prev) return { dir: 'down', diff: prev - cur };
    return { dir: 'same', diff: 0 };
  };

  let msg;
  const better = (workoutCount > prevWorkoutCount) || (prCount > prevPrCount);
  const worse = (workoutCount < prevWorkoutCount) && (prCount <= prevPrCount);
  if (prCount >= 5) msg = t('week_better_lot');
  else if (better) msg = t('week_better');
  else if (worse) msg = t('week_worse');
  else msg = t('week_same');

  return {
    rangeText, dayFlags,
    workoutCount, prevWorkoutCount, workoutCmp: cmp(workoutCount, prevWorkoutCount),
    prCount, prevPrCount, prCmp: cmp(prCount, prevPrCount),
    totalMin, totalHours: Math.round(totalMin / 60 * 10) / 10, prevMin, hoursCmp: cmp(Math.round(totalMin / 60), Math.round(prevMin / 60)),
    muscleDist, topMuscle, maxStreak, bestPR, proverb, msg
  };
}

const MUSCLE_COLORS = ['#FF3D3D', '#FFB74D', '#4A90E2', '#A78BFA', '#34D399', '#26a69a'];
// Tüm antrenman günlerini kart verisiyle hazırlar. En yeni gün başta.
// Her gün: tarih, gün adı, süre, saat aralığı, set, tekrar, kas dağılımı, PR'lar, geçen sefere göre karşılaştırma.
function buildJournalEntries(data) {
  if (!data || !data.logs || data.logs.length === 0) return [];
  const isBetter = (a, b) => a.weight > b.weight || a.weight === b.weight && a.reps > b.reps;
  const bestOf = sets => sets.reduce((best, s) => !best || isBetter(s, best) ? s : best, null);

  // Devam eden (bitmemiş) seansı olan günler — günlükte GÖSTERME (antrenman bitince çıksın)
  const activeDayKeys = new Set((data.sessions || []).filter(s => s.startTime && !s.endTime).map(s => dateKey(s.startTime)));

  // Logları güne + dayType'a göre grupla (bir günde birden fazla gün-tipi olabilir ama genelde tek)
  const dayGroups = {}; // key: dateKey -> { logs, dayTypes:Set }
  data.logs.forEach(l => {
    const k = dateKey(l.timestamp);
    if (activeDayKeys.has(k)) return; // aktif seans günü: henüz tamamlanmadı, atla
    if (!dayGroups[k]) dayGroups[k] = { logs: [], dayTypes: new Set() };
    dayGroups[k].logs.push(l);
    if (l.dayType) dayGroups[k].dayTypes.add(l.dayType);
  });

  const dayConfigMap = buildDayConfigMap(data.customDays || [], data.hiddenDays || [], data.dayOverrides || {});
  const weekdays = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  const months = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  const monthsFull = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

  const entries = [];
  Object.entries(dayGroups).forEach(([dk, grp]) => {
    const parts = dk.split('-').map(Number);
    const dateObj = new Date(parts[0], parts[1], parts[2]);
    const dayStart = new Date(parts[0], parts[1], parts[2]).setHours(0, 0, 0, 0);
    const dayEnd = dayStart + 86400000;

    // Bu güne ait session (saat aralığı + süre)
    const session = (data.sessions || []).find(s => dateKey(s.startTime) === dk && s.endTime);
    let timeRange = null, durationMin = null;
    if (session && session.endTime) {
      const st = new Date(session.startTime), en = new Date(session.endTime);
      const pad = n => String(n).padStart(2, '0');
      timeRange = pad(st.getHours()) + ':' + pad(st.getMinutes()) + '–' + pad(en.getHours()) + ':' + pad(en.getMinutes());
      durationMin = Math.max(1, Math.round((session.endTime - session.startTime) / 60000));
    }

    // Gün tipi adı + renk
    const primaryDayType = grp.dayTypes.size > 0 ? [...grp.dayTypes][0] : (session && session.dayType) || null;
    const cfg = primaryDayType && dayConfigMap[primaryDayType] ? dayConfigMap[primaryDayType] : null;
    const dayName = cfg ? cfg.name : (primaryDayType || 'Antrenman');
    const accent = cfg ? cfg.accent : 'var(--accent)';

    // Egzersizlere göre grupla
    const byExercise = {};
    grp.logs.forEach(l => {
      if (!byExercise[l.exerciseName]) byExercise[l.exerciseName] = [];
      byExercise[l.exerciseName].push(l);
    });

    let totalSets = 0, totalReps = 0, totalVolume = 0;
    const exercises = []; // { name, sets:[{weight,reps,isTop,prType,prev,delta}], topPR, backoffPR }
    const muscleVol = {}; // kas -> hacim

    Object.entries(byExercise).forEach(([exName, exLogs]) => {
      const sorted = [...exLogs].sort((a, b) => a.timestamp - b.timestamp);
      const todayTop = sorted[0];
      const todayBackoffs = sorted.slice(1);
      const todayBestBackoff = todayBackoffs.length ? bestOf(todayBackoffs) : null;

      // Önceki günlerin verisi (bu günden önce)
      const priorLogs = data.logs.filter(l => l.exerciseName === exName && l.timestamp < dayStart);
      const priorByDay = {};
      priorLogs.forEach(l => {
        const k = dateKey(l.timestamp);
        if (!priorByDay[k]) priorByDay[k] = [];
        priorByDay[k].push(l);
      });
      const priorTops = [], priorBackoffs = [];
      Object.values(priorByDay).forEach(dl => {
        const ds = [...dl].sort((a, b) => a.timestamp - b.timestamp);
        if (ds[0]) priorTops.push(ds[0]);
        ds.slice(1).forEach(s => priorBackoffs.push(s));
      });
      const priorTopPR = priorTops.length ? bestOf(priorTops) : null;
      const priorBackoffPR = priorBackoffs.length ? bestOf(priorBackoffs) : null;
      // Son antrenman günü (karşılaştırma için)
      const priorDayKeys = Object.keys(priorByDay).sort((a, b) => {
        const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
        return new Date(pb[0], pb[1], pb[2]) - new Date(pa[0], pa[1], pa[2]);
      });
      const lastDayKey = priorDayKeys[0];
      let lastTop = null, lastBackoff = null;
      if (lastDayKey) {
        const ld = [...priorByDay[lastDayKey]].sort((a, b) => a.timestamp - b.timestamp);
        lastTop = ld[0];
        const lb = ld.slice(1);
        lastBackoff = lb.length ? bestOf(lb) : null;
      }

      // Set kartları
      const setCards = sorted.map((s, idx) => {
        totalSets++; totalReps += s.reps; totalVolume += s.weight * s.reps;
        const isTop = idx === 0;
        // Karşılaştırma referansı: top ise lastTop, backoff ise lastBackoff
        const ref = isTop ? lastTop : lastBackoff;
        let prType = null; // 'top' | 'backoff' | null
        let firstEver = false;
        // PR mı?
        if (isTop && !priorTopPR) firstEver = true;
        if (isTop && priorTopPR && isBetter(s, priorTopPR)) prType = 'top';
        // backoff PR sadece o günün EN İYİ backoff'una atanır (aşağıda)
        // delta hesabı (ağırlık referanslı)
        let delta = null;
        if (ref) {
          if (s.weight > ref.weight) delta = { dir: 'up', kg: +(s.weight - ref.weight).toFixed(1), type: 'kg' };
          else if (s.weight < ref.weight) delta = { dir: 'down', kg: +(ref.weight - s.weight).toFixed(1), type: 'kg' };
          else if (s.reps > ref.reps) delta = { dir: 'up', reps: s.reps - ref.reps, type: 'reps' };
          else if (s.reps < ref.reps) delta = { dir: 'down', reps: ref.reps - s.reps, type: 'reps' };
          else delta = { dir: 'same' };
        }
        return {
          weight: s.weight, reps: s.reps, isTop,
          prType, firstEver,
          prev: ref ? { weight: ref.weight, reps: ref.reps } : null,
          delta
        };
      });

      // Backoff PR işaretle (en iyi backoff, prior backoff PR'ı geçtiyse)
      let backoffPRval = null;
      if (todayBestBackoff && priorBackoffPR && isBetter(todayBestBackoff, priorBackoffPR)) {
        backoffPRval = { weight: todayBestBackoff.weight, reps: todayBestBackoff.reps, prev: { weight: priorBackoffPR.weight, reps: priorBackoffPR.reps } };
        // ilgili set kartına backoff işareti koy
        const bIdx = setCards.findIndex((sc, i) => i > 0 && sc.weight === todayBestBackoff.weight && sc.reps === todayBestBackoff.reps);
        if (bIdx >= 0) setCards[bIdx].prType = 'backoff';
      }
      let topPRval = null;

// Avatar harfi + rengi (isimden)
// Bir foto dosyasını kare kırp + 200x200 küçült + JPEG sıkıştır → base64 data URL döner
// (küçük tutulur ki Firestore'a sığsın ~15-30KB, her yerde net görünsün)
function processProfilePhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const SIZE = 200;
        const canvas = document.createElement('canvas');
        canvas.width = SIZE;
        canvas.height = SIZE;
        const ctx = canvas.getContext('2d');
        // Kare kırp (merkezden) — kısa kenara göre
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);
        // JPEG %82 kalite — net ama küçük
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Profil fotoğrafını Firestore'a yaz (users/{uid}/public/profile → {photo})
async function saveProfilePhoto(uid, dataUrl) {
  if (!window.APEX_DB) return;
  try {
    await window.APEX_DB.collection('users').doc(uid).collection('public').doc('profile').set({
      photo: dataUrl || '',
      updatedAt: Date.now()
    }, { merge: true });
  } catch (e) {}
}
// Bir kullanıcının profil fotosunu oku
async function loadProfilePhoto(uid) {
  if (!window.APEX_DB) return null;
  try {
    const snap = await window.APEX_DB.collection('users').doc(uid).collection('public').doc('profile').get();
    return snap.exists && snap.data().photo ? snap.data().photo : null;
  } catch (e) {
    return null;
  }
}

function avatarFor(name) {
  const letter = (name || '?').trim().charAt(0).toUpperCase() || '?';
  const colors = ['linear-gradient(135deg,var(--accent),#8B1111)', 'linear-gradient(135deg,#4A90E2,#1E3A5F)', 'linear-gradient(135deg,#34D399,#064E3B)', 'linear-gradient(135deg,#A78BFA,#4C1D95)', 'linear-gradient(135deg,#FFA726,#8B6914)'];
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % colors.length;
  return {
    letter,
    bg: colors[h]
  };
}

// Feed'e kart yaz (kendi kutuna). shared=false ise yazma (gizli salon).
async function writeFeedItem(uid, item) {
  if (!window.APEX_DB || !uid) return;
  try {
    const id = 'f' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    await window.APEX_DB.collection('users').doc(uid).collection('feed').doc(id).set({
      ...item,
      at: item.at || Date.now(),
      reactions: {}
    });
    // Eski kartları temizle (son 50 tut) - basit yaklaşım: çok eski olanları silme şimdilik atla
  } catch (e) {}
}

// Bir arkadaşın son feed kartlarını çek
async function loadFriendFeed(friendUid, limit) {
  if (!window.APEX_DB) return [];
  try {
    const snap = await window.APEX_DB.collection('users').doc(friendUid).collection('feed').orderBy('at', 'desc').limit(limit || 20).get();
    return snap.docs.map(d => ({
      id: d.id,
      ownerUid: friendUid,
      ...d.data()
    }));
  } catch (e) {
    return [];
  }
}

// Tüm feed'i topla: kendim + arkadaşlar, birleştir, tarihe göre sırala
async function loadCombinedFeed(myUid, friends, myInfo) {
  const uids = [{
    uid: myUid,
    username: myInfo.username,
    name: myInfo.name
  }, ...friends];
  const all = [];
  await Promise.all(uids.map(async u => {
    const items = await loadFriendFeed(u.uid, 15);
    items.forEach(it => {
      all.push({
        ...it,
        ownerUsername: u.username,
        ownerName: u.name || u.username
      });
    });
  }));
  all.sort((a, b) => (b.at || 0) - (a.at || 0));
  return all.slice(0, 50);
}

// Reaksiyon ekle/kaldır (toggle). reactionType: 'fire'|'muscle'|'clap'
async function toggleReaction(ownerUid, itemId, reactionType, myUid) {
  if (!window.APEX_DB) return;
  const ref = window.APEX_DB.collection('users').doc(ownerUid).collection('feed').doc(itemId);
  try {
    const snap = await ref.get();
    if (!snap.exists) return;
    const data = snap.data();
    const reactions = data.reactions || {};
    // Emoji ↔ legacy anahtar eşlemesi (🔥 ile fire aynı şey sayılır)
    const emojiToLegacy = { '🔥': 'fire', '💪': 'muscle', '👏': 'clap' };
    const legacyKey = emojiToLegacy[reactionType];
    // Hem emoji hem legacy anahtarda bu uid var mı kontrol et
    const inEmoji = (reactions[reactionType] || []).indexOf(myUid) >= 0;
    const inLegacy = legacyKey ? (reactions[legacyKey] || []).indexOf(myUid) >= 0 : false;
    const wasReacted = inEmoji || inLegacy;
    // Bu uid'i HER İKİ anahtardan da temizle (tekrarları da)
    reactions[reactionType] = (reactions[reactionType] || []).filter(u => u !== myUid);
    if (legacyKey && reactions[legacyKey]) {
      reactions[legacyKey] = reactions[legacyKey].filter(u => u !== myUid);
    }
    // Tepki yoksa şimdi ekle (emoji anahtarına, tek kez)
    if (!wasReacted) reactions[reactionType].push(myUid);
    await ref.update({
      reactions: reactions
    });
  } catch (e) {}
}

// Feed kartı için zaman formatı (Türkçe, "2 saat önce" gibi)
function feedTimeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return t('time_just_now');
  if (min < 60) return t('date_min_ago',{n:min});
  const hr = Math.floor(min / 60);
  if (hr < 24) return t('date_hr_ago',{n:hr});
  const day = Math.floor(hr / 24);
  if (day === 1) return t('date_yesterday');
  if (day < 7) return t('date_days_ago',{n:day});
  return new Date(ts).toLocaleDateString((CURRENT_LANG === 'en' ? 'en-US' : 'tr-TR'), {
    day: 'numeric',
    month: 'short'
  });
}

// Bir hareketin kaç haftadır takılı olduğunu hesapla (plato feed kartı için)
function getStuckWeeksForExercise(logs, exerciseName) {
  const exLogs = logs.filter(l => l.exerciseName === exerciseName).sort((a, b) => a.timestamp - b.timestamp);
  if (exLogs.length < 2) return 0;
  const byDay = {};
  exLogs.forEach(l => {
    const k = dateKey(l.timestamp);
    if (!byDay[k] || l.timestamp < byDay[k].timestamp) byDay[k] = l;
  });
  const days = Object.values(byDay).sort((a, b) => a.timestamp - b.timestamp);
  let best = 0, lastImproveTs = days[0].timestamp;
  for (let i = 0; i < days.length - 1; i++) {
    if (days[i].weight > best) { best = days[i].weight; lastImproveTs = days[i].timestamp; }
  }
  const weeks = Math.floor((Date.now() - lastImproveTs) / (7 * 86400000));
  return weeks;
}

// PROFİL/İSTATİSTİK + LİDER TABLOSU (Faz 4)
// ═══════════════════════════════════════════
// Veri modeli: users/{uid}/public/stats
//   { username, name, updatedAt,
//     workoutCount, prCount, streak, weeklyGain, weeklyWorkouts, weeklyPRs,
//     topPRs:[{exerciseName,weight,reps}], gymName }

// Paylaşılabilir istatistikleri hesapla (verilen salon verisinden)
function computePublicStats(data, gymName) {
  const logs = data.logs || [];
  const now = Date.now();
  const weekStart = now - 7 * 86400000;

  // Antrenman günleri (benzersiz gün)
  const workoutDays = new Set(logs.map(l => dateKey(l.timestamp)));
  const workoutCount = workoutDays.size;

  // Bu hafta antrenman
  const weeklyWorkouts = new Set(logs.filter(l => l.timestamp >= weekStart).map(l => dateKey(l.timestamp))).size;

  // Egzersiz başına PR geçmişi (rekor sayısı + bu hafta gelişim)
  const exNames = [...new Set(logs.map(l => l.exerciseName))];
  let prCount = 0;
  let weeklyGain = 0;
  let weeklyPRs = 0;
  const topPRs = [];
  exNames.forEach(name => {
    const exLogs = logs.filter(l => l.exerciseName === name);
    // Günlük top setler
    const byDay = {};
    exLogs.forEach(l => {
      const k = dateKey(l.timestamp);
      if (!byDay[k] || l.timestamp < byDay[k].timestamp) byDay[k] = l;
    });
    const days = Object.values(byDay).sort((a, b) => a.timestamp - b.timestamp);
    if (days.length === 0) return;

    // Toplam rekor sayısı (kümülatif iyileşmeler)
    let improvements = 0;
    let runningBest = 0;
    days.forEach(d => {
      if (d.weight > runningBest) {
        runningBest = d.weight;
        improvements++;
      }
    });
    prCount += improvements;

    // BU HAFTA GELİŞİM:
    // Hafta başından önceki en iyi rekoru bul (varsa)
    let bestBeforeWeek = 0;
    days.forEach(d => {
      if (d.timestamp < weekStart && d.weight > bestBeforeWeek) bestBeforeWeek = d.weight;
    });
    // Bu hafta içindeki günler
    const thisWeekDays = days.filter(d => d.timestamp >= weekStart);
    if (thisWeekDays.length > 0) {
      const bestThisWeek = Math.max(...thisWeekDays.map(d => d.weight));
      if (bestBeforeWeek > 0) {
        // Geçmiş rekor var → bu haftaki en iyi, ona göre ne kadar arttı
        if (bestThisWeek > bestBeforeWeek) {
          weeklyGain += bestThisWeek - bestBeforeWeek;
          weeklyPRs++;
        }
      } else {
        // Bu egzersizi ilk kez bu hafta yaptı → hafta içi ilk gün vs en iyi gün farkı
        const firstThisWeek = thisWeekDays[0].weight;
        if (bestThisWeek > firstThisWeek) {
          weeklyGain += bestThisWeek - firstThisWeek;
        }
        weeklyPRs++;
      }
    }

    // En iyi PR (top set)
    const bestDay = days.reduce((b, d) => !b || d.weight > b.weight ? d : b, null);
    if (bestDay) topPRs.push({
      exerciseName: name,
      weight: bestDay.weight,
      reps: bestDay.reps
    });
  });

  // Top PR'ları ağırlığa göre sırala, ilk 5
  topPRs.sort((a, b) => b.weight - a.weight);

  // EN ÇOK ÇALIŞILAN KAS GRUBU (tüm hacmi kaslara dağıt)
  const muscleVol = {};
  logs.forEach(l => {
    const muscles = getExerciseMuscles(l.exerciseName, data.customMuscleMap);
    if (muscles && typeof muscles === 'object') {
      const weights = Object.entries(muscles);
      const totalW = weights.reduce((s, [, w]) => s + w, 0);
      if (totalW > 0) {
        const vol = (l.weight || 0) * (l.reps || 0);
        weights.forEach(([m, w]) => { muscleVol[m] = (muscleVol[m] || 0) + vol * (w / totalW); });
      }
    }
  });
  const totalMuscleVol = Object.values(muscleVol).reduce((a, b) => a + b, 0);
  let topMuscle = null;
  if (totalMuscleVol > 0) {
    const sorted = Object.entries(muscleVol).sort((a, b) => b[1] - a[1]);
    const [code, vol] = sorted[0];
    topMuscle = {
      name: MUSCLES[code] ? t('muscle_'+code) : code,
      pct: Math.round(vol / totalMuscleVol * 100)
    };
  }

  // Gün serisi (streak)
  let streak = 0;
  let cursor = new Date();
  for (let i = 0; i < 365; i++) {
    const k = dateKey(cursor.getTime());
    if (workoutDays.has(k)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else if (i === 0) {
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return {
    workoutCount,
    prCount,
    streak,
    weeklyGain,
    weeklyWorkouts,
    weeklyPRs,
    topPRs: topPRs.slice(0, 5),
    topMuscle: topMuscle,
    gymName: gymName || ''
  };
}

// İstatistikleri buluta yaz (paylaşımlı salondan)
async function writePublicStats(uid, username, name, stats) {
  if (!window.APEX_DB || !uid) return;
  try {
    await window.APEX_DB.collection('users').doc(uid).collection('public').doc('stats').set({
      username: username || '',
      name: name || '',
      updatedAt: Date.now(),
      ...stats
    });
  } catch (e) {}
}

// Bir kullanıcının public istatistiklerini oku
async function loadPublicStats(uid) {
  if (!window.APEX_DB) return null;
  try {
    const snap = await window.APEX_DB.collection('users').doc(uid).collection('public').doc('stats').get();
    if (snap.exists) return snap.data();
  } catch (e) {}
  return null;
}

// Lider tablosu için: kendim + arkadaşların statlarını topla
async function loadLeaderboard(myUid, myInfo, friends) {
  const all = [{
    uid: myUid,
    username: myInfo.username,
    name: myInfo.name,
    isMe: true
  }, ...friends.map(f => ({
    ...f,
    isMe: false
  }))];
  const results = [];
  await Promise.all(all.map(async u => {
    const stats = await loadPublicStats(u.uid);
    if (stats) {
      results.push({
        uid: u.uid,
        username: stats.username || u.username,
        name: stats.name || u.name,
        isMe: u.isMe,
        ...stats
      });
    } else if (u.isMe) {
      // Kendim için stat yoksa boş göster
      results.push({
        uid: u.uid,
        username: u.username,
        name: u.name,
        isMe: true,
        weeklyGain: 0,
        prCount: 0,
        workoutCount: 0,
        weeklyWorkouts: 0
      });
    }
  }));
  return results;
}

function computeGoalProgress(goal, data) {

// Bir egzersizin günlük top setlerini (kronolojik) döndürür — PR geçmişi için
function getExercisePRHistory(logs, exerciseName) {
  const byDay = {};
  logs.filter(l => l.exerciseName === exerciseName).forEach(l => {
    const k = dateKey(l.timestamp);
    if (!byDay[k]) byDay[k] = [];
    byDay[k].push(l);
  });
  // Her gün için top set (ilk set) ve o günkü en iyi
  const dayEntries = Object.entries(byDay).map(([k, dayLogs]) => {
    const sorted = [...dayLogs].sort((a, b) => a.timestamp - b.timestamp);
    const topSet = sorted[0];
    return {
      dateKey: k,
      ts: topSet.timestamp,
      weight: topSet.weight,
      reps: topSet.reps
    };
  }).sort((a, b) => a.ts - b.ts);
  // Kümülatif rekor eğrisi: her noktada o ana kadarki en iyi top
  let best = null;
  const prCurve = dayEntries.map(e => {
    if (!best || e.weight > best.weight || e.weight === best.weight && e.reps > best.reps) best = {
      weight: e.weight,
      reps: e.reps
    };
    return {
      ts: e.ts,
      weight: best.weight,
      reps: best.reps,
      sessionWeight: e.weight,
      sessionReps: e.reps
    };
  });
  return prCurve;
}

// Tahmini 1RM (Epley formülü)
function estimate1RM(weight, reps) {
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}
