// Bir egzersizin günlük top setlerini (kronolojik) döndürür — PR geçmişi için
function getExercisePRHistory(logs, exerciseName) {
  const byDay = {};
  logs.filter(l => l.exerciseName === exerciseName).forEach(l => {
    const k = dateKey(l.timestamp);
    if (!byDay[k]) byDay[k] = [];
    byDay[k].push(l);
  });
  // Her gün için top set (ilk set) ve o günkü en iyi
  const dayEntries = Object.entries(byDay).map(([k, dayLogs]) => {
    const sorted = [...dayLogs].sort((a, b) => a.timestamp - b.timestamp);
    const topSet = sorted[0];
    return { dateKey: k, ts: topSet.timestamp, weight: topSet.weight, reps: topSet.reps };
  }).sort((a, b) => a.ts - b.ts);
  // Kümülatif rekor eğrisi: her noktada o ana kadarki en iyi top
  let best = null;
  const prCurve = dayEntries.map(e => {
    if (!best || e.weight > best.weight || (e.weight === best.weight && e.reps > best.reps)) best = { weight: e.weight, reps: e.reps };
    return { ts: e.ts, weight: best.weight, reps: best.reps, sessionWeight: e.weight, sessionReps: e.reps };
  });
  return prCurve;
}

// Tahmini 1RM (Epley formülü)
function estimate1RM(weight, reps) {
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}

function ProgressTab({ authUser, activeGym, onOpenGymPicker }) {
  const [data, setData] = useState({ exercises: DEFAULT_EXERCISES, logs: [], sessions: [], customDays: [] });
  const [detailExercise, setDetailExercise] = useState(null);
  const cloudReady = !!(authUser && window.APEX_FIREBASE_OK && window.APEX_DB);
  const gymId = (activeGym && activeGym.id) || 'default';
  const lsKey = gymStorageKey(gymId);
  const docName = gymDocName(gymId);

  // Veri yükle (workout ile aynı kaynak, salona göre)
  useEffect(() => {
    let localData = null;
    try {
      const raw = localStorage.getItem(lsKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        localData = { exercises: { ...DEFAULT_EXERCISES, ...(parsed.exercises || {}) }, logs: parsed.logs || [], sessions: parsed.sessions || [], customDays: parsed.customDays || [], customMuscleMap: parsed.customMuscleMap || {} };
        setData(localData);
      } else {
        setData({ exercises: DEFAULT_EXERCISES, logs: [], sessions: [], customDays: [], customMuscleMap: {} });
      }
    } catch (e) {}
    if (cloudReady) {
      window.APEX_DB.collection('users').doc(authUser.uid).collection('data').doc(docName).get().then((snap) => {
        if (snap.exists) {
          const cloud = snap.data();
          setData({ exercises: { ...DEFAULT_EXERCISES, ...(cloud.exercises || {}) }, logs: cloud.logs || [], sessions: cloud.sessions || [], customDays: cloud.customDays || [], customMuscleMap: cloud.customMuscleMap || {} });
        }
      }).catch(() => {});
    }
  }, [cloudReady, authUser, gymId]);

  const dayConfig = useMemo(() => buildDayConfigMap(data.customDays), [data.customDays]);

  // Tüm benzersiz egzersizler
  const allExercises = useMemo(() => {
    const set = new Set();
    data.logs.forEach(l => set.add(l.exerciseName));
    return [...set];
  }, [data.logs]);

  // Her egzersiz için PR eğrisi + son PR tarihi + plato durumu
  const exerciseStats = useMemo(() => {
    const now = Date.now();
    const PLATEAU_WEEKS = 4;
    const plateauMs = PLATEAU_WEEKS * 7 * 86400000;
    return allExercises.map(name => {
      const curve = getExercisePRHistory(data.logs, name);
      if (curve.length === 0) return null;
      const currentPR = curve[curve.length - 1];
      // Son rekor artışının tarihi: eğride weight'in en son arttığı nokta
      let lastImproveTs = curve[0].ts;
      for (let i = 1; i < curve.length; i++) {
        if (curve[i].weight > curve[i-1].weight || (curve[i].weight === curve[i-1].weight && curve[i].reps > curve[i-1].reps)) {
          lastImproveTs = curve[i].ts;
        }
      }
      const weeksSince = Math.floor((now - lastImproveTs) / (7 * 86400000));
      const isStuck = (now - lastImproveTs) >= plateauMs && curve.length >= 2;
      return {
        name, curve, currentPR,
        weight: currentPR.weight, reps: currentPR.reps,
        lastImproveTs, weeksSince, isStuck,
        oneRM: estimate1RM(currentPR.weight, currentPR.reps),
      };
    }).filter(Boolean);
  }, [allExercises, data.logs]);

  // Bu ay kırılan PR sayısı + en büyük sıçrama
  const monthStats = useMemo(() => {
    const d = new Date();
    const monthStart = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    let prCount = 0;
    let biggestJump = null; // { name, delta }
    exerciseStats.forEach(es => {
      // Bu ay içindeki rekor artışlarını say
      for (let i = 1; i < es.curve.length; i++) {
        if (es.curve[i].ts >= monthStart) {
          const improved = es.curve[i].weight > es.curve[i-1].weight;
          if (improved) {
            prCount++;
            const delta = es.curve[i].weight - es.curve[i-1].weight;
            if (!biggestJump || delta > biggestJump.delta) biggestJump = { name: es.name, delta };
          }
        }
      }
      // İlk kayıt da bu aysa say (yeni egzersiz = ilk rekor)
      if (es.curve.length === 1 && es.curve[0].ts >= monthStart) prCount++;
    });
    return { prCount, biggestJump };
  }, [exerciseStats]);

  // Bu ay antrenman sayısı + gün serisi
  const trainingStats = useMemo(() => {
    const d = new Date();
    const monthStart = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    const workoutDays = new Set();
    data.logs.forEach(l => { if (l.timestamp >= monthStart) workoutDays.add(dateKey(l.timestamp)); });
    // Gün serisi: bugünden geriye kaç farklı gün üst üste antrenman (basit: son 60 günde antrenman yapılan ardışık günler)
    const allDays = new Set(data.logs.map(l => dateKey(l.timestamp)));
    let streak = 0;
    let cursor = new Date();
    for (let i = 0; i < 365; i++) {
      const k = dateKey(cursor.getTime());
      if (allDays.has(k)) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else if (i === 0) { cursor.setDate(cursor.getDate() - 1); } // bugün boşsa dünden başla
      else break;
    }
    return { monthWorkouts: workoutDays.size, streak };
  }, [data.logs]);

  // Takılan hareketler (plato)
  const stuckExercises = useMemo(() => exerciseStats.filter(es => es.isStuck).sort((a, b) => b.weeksSince - a.weeksSince), [exerciseStats]);

  // İlerleyenler (rekor gelişimi listesi) — son artışa göre sıralı
  const improvingExercises = useMemo(() => {
    return [...exerciseStats].sort((a, b) => b.lastImproveTs - a.lastImproveTs);
  }, [exerciseStats]);

  // Kas grubu ilerlemesi: son 3 ayda her kasın toplam hacim değişimi (basitleştirilmiş güç göstergesi)
  const muscleProgress = useMemo(() => {
    const now = Date.now();
    const recentStart = now - 90 * 86400000;
    const prevStart = now - 180 * 86400000;
    const acc = {}; // muscle -> { recent: vol, prev: vol }
    Object.keys(MUSCLES).forEach(m => acc[m] = { recent: 0, prev: 0 });
    data.logs.forEach(l => {
      const muscles = getExerciseMuscles(l.exerciseName, data.customMuscleMap);
      if (!muscles) return;
      const vol = l.weight * l.reps;
      Object.entries(muscles).forEach(([m, w]) => {
        if (!acc[m]) return;
        if (l.timestamp >= recentStart) acc[m].recent += vol * w;
        else if (l.timestamp >= prevStart) acc[m].prev += vol * w;
      });
    });
    const list = Object.keys(MUSCLES).map(m => {
      const { recent, prev } = acc[m];
      if (recent === 0) return null;
      const pct = prev > 0 ? Math.round(((recent - prev) / prev) * 100) : (recent > 0 ? 100 : 0);
      return { key: m, tr: MUSCLES[m].tr, recent, pct };
    }).filter(Boolean).sort((a, b) => b.recent - a.recent);
    const maxRecent = Math.max(...list.map(x => x.recent), 1);
    return { list, maxRecent };
  }, [data.logs, data.customMuscleMap]);

  const muscleColorMap = {
    chest:'#FF3D3D', frontDelts:'#D4A547', sideDelts:'#D4A547', rearDelts:'#D4A547',
    biceps:'#A78BFA', triceps:'#A78BFA', forearms:'#A78BFA', abs:'#FF3D3D',
    lats:'#4A90E2', traps:'#4A90E2', lowerBack:'#4A90E2',
    quads:'#34D399', hamstrings:'#34D399', glutes:'#34D399', calves:'#34D399',
  };

  // Tek hareket detay ekranı
  if (detailExercise) {
    const es = exerciseStats.find(e => e.name === detailExercise);
    if (es) return <ExerciseProgressDetail es={es} onBack={() => setDetailExercise(null)} />;
  }

  const topMuscle = muscleProgress.list.find(m => m.pct > 0);

  return (
    <div style={S.screen}>
      <div style={S.header}>
        <button onClick={onOpenGymPicker} style={S.gymSelector}>
          <span style={{ fontSize: 14 }}>📍</span>
          <span style={S.gymSelectorName}>{activeGym ? activeGym.name : 'Salonum'}</span>
          <span style={{ color: '#FF3D3D', fontSize: 11 }}>▾</span>
        </button>
        <div style={S.topBarTitle}>İLERLEME</div>
        <div style={{ width: 40 }} />
      </div>

      {exerciseStats.length === 0 ? (
        <div style={{ textAlign: 'center', color: '#555', marginTop: 60, fontSize: 14, lineHeight: 1.6 }}>
          Henüz veri yok.<br />Antrenman kaydettikçe ilerlemen burada görünecek 💪
        </div>
      ) : (
        <>
          {/* Kahraman: bu ay PR */}
          <div style={S.progHero}>
            <div style={S.progHeroBig}>{monthStats.prCount}</div>
            <div style={S.progHeroLbl}>Bu ay kırılan rekor</div>
            {monthStats.biggestJump && (
              <div style={S.progHeroDelta}>🔥 En büyük sıçrama: {monthStats.biggestJump.name} +{monthStats.biggestJump.delta}kg</div>
            )}
          </div>

          {/* İki kutu */}
          <div style={S.progStatGrid}>
            <div style={S.progStatBox}><div style={S.progStatV}>{trainingStats.monthWorkouts}</div><div style={S.progStatL}>BU AY ANTRENMAN</div></div>
            <div style={S.progStatBox}><div style={S.progStatV}>{trainingStats.streak}</div><div style={S.progStatL}>GÜN SERİSİ</div></div>
          </div>

          {/* Takılan hareketler */}
          {stuckExercises.length > 0 && (
            <div style={S.plateauBox}>
              <div style={S.plateauTitle}>⏳ TAKILDIĞIN HAREKETLER</div>
              {stuckExercises.map((es, i) => (
                <button key={i} onClick={() => setDetailExercise(es.name)} style={S.plateauRow}>
                  <div style={{ flex: 1, textAlign: 'left' }}>
                    <div style={S.plateauName}>{es.name}</div>
                    <div style={S.plateauSub}>{es.weight}kg · son rekor {es.weeksSince} hafta önce</div>
                  </div>
                  <div style={S.plateauBadge}>{es.weeksSince} hafta</div>
                </button>
              ))}
            </div>
          )}

          {/* Kas grubu ilerlemesi */}
          {muscleProgress.list.length > 0 && (
            <>
              {topMuscle && (
                <div style={S.winnerBanner}>
                  <div style={S.winnerLbl}>🔥 BU DÖNEM EN ÇOK GELİŞEN</div>
                  <div style={S.winnerName}>{topMuscle.tr}</div>
                  <div style={S.winnerDelta}>▲ %{topMuscle.pct} güç/hacim artışı</div>
                </div>
              )}
              <div style={S.sectionLabel}>KAS GRUBU · SON 3 AY DEĞİŞİM</div>
              <div style={S.progCard}>
                {muscleProgress.list.slice(0, 8).map((m, i) => (
                  <div key={i} style={S.muscleProgRow}>
                    <div style={S.mpName}>{m.tr}</div>
                    <div style={S.mpBarTrack}>
                      <div style={{ ...S.mpBar, width: `${(m.recent / muscleProgress.maxRecent) * 100}%`, background: muscleColorMap[m.key] || '#FF3D3D' }} />
                    </div>
                    <div style={{ ...S.mpDelta, color: m.pct > 0 ? '#4CAF50' : '#888' }}>{m.pct > 0 ? `▲ %${m.pct}` : '▬ 0%'}</div>
                  </div>
                ))}
              </div>
            </>
          )}

          {/* Rekor gelişimi listesi */}
          <div style={S.sectionLabel}>REKOR GELİŞİMİ · dokun, detayı gör</div>
          {improvingExercises.map((es, i) => (
            <button key={i} onClick={() => setDetailExercise(es.name)} style={{ ...S.prRow, ...(es.isStuck ? S.prRowStuck : {}) }}>
              <div style={{ ...S.prRowIc, background: es.isStuck ? 'linear-gradient(135deg,#FFA726,#8B6914)' : 'linear-gradient(135deg,#FF3D3D,#8B1111)' }}>
                {es.isStuck ? '⏳' : '🏋️'}
              </div>
              <div style={{ flex: 1, textAlign: 'left' }}>
                <div style={S.prRowName}>{es.name}</div>
                <div style={{ ...S.prRowSub, color: es.isStuck ? '#FFA726' : '#4CAF50' }}>
                  {es.isStuck ? `⏳ ${es.weeksSince} haftadır takılı` : `tahmini 1RM ~${es.oneRM}kg`}
                </div>
              </div>
              <div style={S.prRowWt}>{es.weight}kg</div>
            </button>
          ))}
        </>
      )}
    </div>
  );
}

// Tek hareket derin grafik ekranı
// Tek hareket derin grafik ekranı — gerçek seans değerleri + crosshair (borsa mantığı)
function ExerciseProgressDetail({ es, onBack }) {
  const [period, setPeriod] = useState('6A'); // 1A 3A 6A 1Y TÜM
  const [touchIdx, setTouchIdx] = useState(null); // crosshair için seçili nokta
  const svgRef = React.useRef(null);
  const periodMs = { '1A': 30, '3A': 90, '6A': 180, '1Y': 365, 'TÜM': 99999 };
  const now = Date.now();
  const cutoff = now - periodMs[period] * 86400000;
  // GERÇEK SEANS değerleri (sessionWeight) — iniş çıkışlı
  const points = es.curve.filter(p => p.ts >= cutoff).map(p => ({ ts: p.ts, weight: p.sessionWeight, reps: p.sessionReps, prWeight: p.weight }));

  // min/max gerçek seans ağırlıklarına göre
  const weights = points.map(p => p.weight);
  const minW = points.length ? Math.min(...weights) : 0;
  const maxW = points.length ? Math.max(...weights) : 1;
  const range = (maxW - minW) || 1;

  // 6 ay önceki vs şimdi kazanç (rekor bazlı)
  const sixMonthAgo = now - 180 * 86400000;
  const oldPoint = es.curve.find(p => p.ts >= sixMonthAgo) || es.curve[0];
  const gain = es.weight - (oldPoint ? oldPoint.weight : es.weight);

  // SVG geometri
  const W = 300, H = 170, padL = 34, padR = 12, padT = 16, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xFor = (i) => points.length <= 1 ? padL + plotW / 2 : padL + (i / (points.length - 1)) * plotW;
  const yFor = (w) => padT + plotH - ((w - minW) / range) * plotH;

  let linePath = '', areaPath = '';
  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.weight);
    linePath += (i === 0 ? `M${x} ${y}` : ` L${x} ${y}`);
  });
  if (points.length > 0) areaPath = linePath + ` L${xFor(points.length-1)} ${padT+plotH} L${xFor(0)} ${padT+plotH} Z`;

  // Y ekseni etiketleri (3 seviye: min, orta, max)
  const yLabels = [maxW, (maxW + minW) / 2, minW].map(v => Math.round(v * 10) / 10);

  // X ekseni etiketleri (baş, orta, son)
  const fmtDate = (ts) => new Date(ts).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });

  // Dokunma → en yakın noktayı bul
  const handleTouch = (clientX) => {
    if (!svgRef.current || points.length === 0 || clientX == null) return;
    const rect = svgRef.current.getBoundingClientRect();
    if (!rect.width) return;
    // Parmağın grafikteki oranı (0..1), sonra SVG koordinatına
    let frac = (clientX - rect.left) / rect.width;
    frac = Math.max(0, Math.min(1, frac));
    const relX = frac * W;
    let nearest = 0, minDist = Infinity;
    points.forEach((p, i) => {
      const d = Math.abs(xFor(i) - relX);
      if (d < minDist) { minDist = d; nearest = i; }
    });
    setTouchIdx(nearest);
  };

  // Native (non-passive) dokunma dinleyicileri — mobil Safari'de güvenilir çalışır,
  // metin seçme/kaydırma davranışını engeller
  React.useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    const onStart = (e) => { if (e.touches && e.touches[0]) { e.preventDefault(); handleTouch(e.touches[0].clientX); } };
    const onMove = (e) => { if (e.touches && e.touches[0]) { e.preventDefault(); handleTouch(e.touches[0].clientX); } };
    const onEnd = () => setTouchIdx(null);
    svg.addEventListener('touchstart', onStart, { passive: false });
    svg.addEventListener('touchmove', onMove, { passive: false });
    svg.addEventListener('touchend', onEnd);
    svg.addEventListener('touchcancel', onEnd);
    return () => {
      svg.removeEventListener('touchstart', onStart);
      svg.removeEventListener('touchmove', onMove);
      svg.removeEventListener('touchend', onEnd);
      svg.removeEventListener('touchcancel', onEnd);
    };
  }, [points, period]);

  const active = touchIdx !== null && points[touchIdx] ? points[touchIdx] : null;

  return (
    <div style={S.screen}>
      <div style={S.topBar}>
        <button onClick={onBack} style={S.iconBtn}>‹ Geri</button>
        <div style={S.topBarTitle}></div>
        <div style={{ width: 60 }} />
      </div>

      <div style={S.exDetailHead}>
        <div style={{ ...S.exDetailIc, background: es.isStuck ? 'linear-gradient(135deg,#FFA726,#8B6914)' : 'linear-gradient(135deg,#FF3D3D,#8B1111)' }}>{es.isStuck ? '⏳' : '🏋️'}</div>
        <div>
          <div style={S.exDetailName}>{es.name}</div>
          <div style={S.exDetailCur}>Güncel TOP rekor: {es.weight}kg × {es.reps}</div>
        </div>
      </div>

      <div style={S.exBigStats}>
        <div style={S.exStat}><div style={{ ...S.exStatV, color: '#FF3D3D' }}>{es.weight}</div><div style={S.exStatL}>ŞU AN (KG)</div></div>
        <div style={S.exStat}><div style={{ ...S.exStatV, color: gain >= 0 ? '#4CAF50' : '#FF5252' }}>{gain >= 0 ? '+' : ''}{gain}</div><div style={S.exStatL}>6 AYDA (KG)</div></div>
        <div style={S.exStat}><div style={S.exStatV}>~{es.oneRM}</div><div style={S.exStatL}>TAHMİNİ 1RM</div></div>
      </div>

      <div style={S.periodToggle}>
        {['1A','3A','6A','1Y','TÜM'].map(p => (
          <button key={p} onClick={() => { setPeriod(p); setTouchIdx(null); }} style={{ ...S.periodBtn, ...(period === p ? S.periodBtnActive : {}) }}>{p}</button>
        ))}
      </div>

      <div style={{ ...S.progCard, padding: 14 }}>
        {/* Crosshair balonu */}
        {active && (
          <div style={S.crosshairTip}>
            <span style={S.crosshairDate}>{fmtDate(active.ts)}</span>
            <span style={S.crosshairVal}>{active.weight}kg × {active.reps}</span>
          </div>
        )}
        {points.length >= 2 ? (
          <svg ref={svgRef} viewBox="0 0 300 170" style={{ width: '100%', display: 'block', touchAction: 'none', cursor: 'crosshair', userSelect: 'none', WebkitUserSelect: 'none', WebkitTouchCallout: 'none' }}
            onMouseDown={(e) => handleTouch(e.clientX)}
            onMouseMove={(e) => { if (e.buttons === 1) handleTouch(e.clientX); }}
            onMouseUp={() => setTouchIdx(null)}
            onMouseLeave={() => setTouchIdx(null)}
          >
            <defs>
              <linearGradient id="exfill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stopColor="#FF3D3D" stopOpacity="0.35"/>
                <stop offset="1" stopColor="#FF3D3D" stopOpacity="0"/>
              </linearGradient>
            </defs>
            {/* Y grid + etiketler */}
            {yLabels.map((v, i) => {
              const y = padT + (i / 2) * plotH;
              return (
                <g key={i}>
                  <line x1={padL} y1={y} x2={W - padR} y2={y} stroke="#1a1a1a" strokeWidth="1"/>
                  <text x={padL - 6} y={y + 3} fill="#666" fontSize="9" textAnchor="end">{v}</text>
                </g>
              );
            })}
            {/* Alan + çizgi */}
            <path d={areaPath} fill="url(#exfill)"/>
            <path d={linePath} fill="none" stroke="#FF3D3D" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            {/* Noktalar */}
            {points.map((p, i) => (
              <circle key={i} cx={xFor(i)} cy={yFor(p.weight)} r={i === points.length-1 ? 4 : 2.5} fill={i === points.length-1 ? '#fff' : '#FF3D3D'} stroke={i === points.length-1 ? '#FF3D3D' : 'none'} strokeWidth="2" style={{ pointerEvents: 'none' }}/>
            ))}
            {/* Crosshair dikey çizgi + vurgu noktası */}
            {active && (
              <g>
                <line x1={xFor(touchIdx)} y1={padT} x2={xFor(touchIdx)} y2={padT + plotH} stroke="#fff" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>
                <circle cx={xFor(touchIdx)} cy={yFor(active.weight)} r="6" fill="#fff" stroke="#FF3D3D" strokeWidth="2.5"/>
              </g>
            )}
            {/* X ekseni etiketleri */}
            <text x={padL} y={H - 6} fill="#666" fontSize="9" textAnchor="start">{fmtDate(points[0].ts)}</text>
            {points.length > 2 && <text x={padL + plotW/2} y={H - 6} fill="#666" fontSize="9" textAnchor="middle">{fmtDate(points[Math.floor(points.length/2)].ts)}</text>}
            <text x={W - padR} y={H - 6} fill="#666" fontSize="9" textAnchor="end">{fmtDate(points[points.length-1].ts)}</text>
            {/* Şeffaf dokunma katmanı — tüm grafiği kaplar, dokunmaları yakalar */}
            <rect x="0" y="0" width={W} height={H} fill="transparent" />
          </svg>
        ) : (
          <div style={{ textAlign: 'center', color: '#555', padding: '30px 0', fontSize: 13 }}>
            Bu dönemde yeterli veri yok.<br />Daha fazla antrenman kaydet 💪
          </div>
        )}
        <div style={{ textAlign: 'center', fontSize: 10, color: '#555', marginTop: 6 }}>
          Grafiğe dokun, o günkü değeri gör · gerçek seans ağırlıkları
        </div>
      </div>

      {es.isStuck && (
        <div style={{ ...S.plateauBox, marginTop: 14 }}>
          <div style={S.plateauTitle}>⏳ {es.weeksSince} HAFTADIR TAKILI</div>
          <div style={{ fontSize: 12, color: '#ccc', lineHeight: 1.5 }}>
            {es.weight}kg'da {es.weeksSince} haftadır yeni rekor yok. Deload (ağırlığı %10 düşürüp tekrar çıkmak) veya rep aralığını değiştirmek platoyu kırabilir.
          </div>
        </div>
      )}
    </div>
  );
}

<script>
  // Manuel Babel derleme — classic runtime'a zorla (import üretmesini engelle)
  (function () {
    function runApp() {
      try {
        var source = document.getElementById('apex-source').textContent;
        var output = Babel.transform(source, {
          presets: [['react', { runtime: 'classic' }]]
        }).code;
        // Derlenen kodu çalıştır
        var script = document.createElement('script');
        script.textContent = output;
        document.body.appendChild(script);
      } catch (e) {
        document.body.innerHTML = '<div style="color:#fff;font-family:sans-serif;padding:40px;text-align:center"><h2 style="color:#FF3D3D">APEX yüklenemedi</h2><pre style="white-space:pre-wrap;color:#888;font-size:12px">' + (e && e.message ? e.message : e) + '</pre></div>';
        console.error('APEX derleme hatası:', e);
      }
    }
    // Babel yüklenene kadar bekle
    if (window.Babel) {
      runApp();
    } else {
      var check = setInterval(function () {
        if (window.Babel) { clearInterval(check); runApp(); }
      }, 50);
    }
  })();
</script>
