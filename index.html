<script>
  // Otomatik güncelleme: yeni sürüm yüklendiğinde önbelleği atla

  (function() {
    try {
      // Service worker varsa temizle (eski PWA önbelleği)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }
      // Eski cache'leri temizle
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        }).catch(function(){});
      }
    } catch (e) {}
  })();
</script>

  push: { name: 'PUSH', subtitle: 'Chest · Shoulders · Triceps', accent: '#FF3D3D', accentSoft: 'rgba(255,61,61,0.15)', gradient: 'linear-gradient(135deg,#FF3D3D,#8B1111)', glowLow: 'rgba(255,61,61,0.08)', glowHigh: 'rgba(255,61,61,0.55)' },

// Premium color palette for custom days. Each entry builds a full day config.
const DAY_COLOR_PALETTE = [
  { id: 'teal',    accent: '#2DD4BF', dark: '#0F766E' },
  { id: 'violet',  accent: '#A78BFA', dark: '#5B21B6' },

const hexToRgb = (hex) => {
  const h = hex.replace('#', '');
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
};

// Build a full day config object from a base accent + dark color
const buildDayConfig = (name, subtitle, accent, dark) => {
  const { r, g, b } = hexToRgb(accent);
  return {
    name: name.toUpperCase(),
    subtitle: subtitle || '',
    accent,
    accentSoft: `rgba(${r},${g},${b},0.15)`,
    gradient: `linear-gradient(135deg,${accent},${dark})`,
    glowLow: `rgba(${r},${g},${b},0.08)`,
    glowHigh: `rgba(${r},${g},${b},0.55)`,
  };
};

// Merge built-in days with user's custom days into a single config map
const buildDayConfigMap = (customDays) => {
  const map = { ...BUILTIN_DAYS };
  (customDays || []).forEach(cd => {
    map[cd.id] = buildDayConfig(cd.name, cd.subtitle, cd.accent, cd.dark);
  });
  return map;
};

const DEFAULT_EXERCISES = {
  push: ['Bench Press', 'Incline Dumbbell Press', 'Shoulder Press', 'Lateral Raise', 'Tricep Pushdown', 'Overhead Tricep Extension'],
  pull: ['Deadlift', 'Pull-up', 'Barbell Row', 'Lat Pulldown', 'Face Pull', 'Barbell Curl', 'Hammer Curl'],
  upper: ['Bench Press', 'Barbell Row', 'Shoulder Press', 'Pull-up', 'Barbell Curl', 'Tricep Extension'],
  leg: ['Squat', 'Romanian Deadlift', 'Leg Press', 'Leg Curl', 'Leg Extension', 'Calf Raise'],
};

// ═══════════════════════════════════════════
// MUSCLE GROUP SYSTEM
// ═══════════════════════════════════════════

// Canonical muscle groups (Turkish labels for UI)
const MUSCLES = {
  chest:      { tr: 'Göğüs',      side: 'front' },
  frontDelts: { tr: 'Ön Omuz',    side: 'front' },
  sideDelts:  { tr: 'Yan Omuz',   side: 'front' },
  rearDelts:  { tr: 'Arka Omuz',  side: 'back' },
  biceps:     { tr: 'Biceps',     side: 'front' },
  triceps:    { tr: 'Triceps',    side: 'back' },
  forearms:   { tr: 'Önkol',      side: 'front' },
  abs:        { tr: 'Karın',      side: 'front' },
  lats:       { tr: 'Sırt (Lat)', side: 'back' },
  traps:      { tr: 'Trapez',     side: 'back' },
  lowerBack:  { tr: 'Bel',        side: 'back' },
  quads:      { tr: 'Quadriceps', side: 'front' },
  hamstrings: { tr: 'Hamstring',  side: 'back' },
  glutes:     { tr: 'Kalça',      side: 'back' },
  calves:     { tr: 'Baldır',     side: 'back' },
};

// Exercise → muscle contribution map. Primary = 1.0, secondary = 0.5.
// Keys are lowercased substrings matched against exercise names.
const EXERCISE_MUSCLE_MAP = [
  // CHEST
  { match: ['bench press', 'chest press', 'bench'], muscles: { chest: 1, frontDelts: 0.5, triceps: 0.5 } },
  { match: ['incline'], muscles: { chest: 1, frontDelts: 0.5, triceps: 0.5 } },
  { match: ['decline'], muscles: { chest: 1, triceps: 0.5 } },
  { match: ['chest fly', 'pec deck', 'cable fly', 'fly', 'dumbbell fly'], muscles: { chest: 1, frontDelts: 0.5 } },
  { match: ['push up', 'push-up', 'pushup', 'dips', 'dip'], muscles: { chest: 1, triceps: 0.5, frontDelts: 0.5 } },
  // SHOULDERS
  { match: ['shoulder press', 'overhead press', 'military press', 'ohp', 'arnold'], muscles: { frontDelts: 1, sideDelts: 0.5, triceps: 0.5 } },
  { match: ['lateral raise', 'side raise', 'lateral'], muscles: { sideDelts: 1 } },
  { match: ['front raise'], muscles: { frontDelts: 1 } },
  { match: ['rear delt', 'reverse fly', 'rear raise'], muscles: { rearDelts: 1 } },
  { match: ['face pull'], muscles: { rearDelts: 1, traps: 0.5 } },
  { match: ['upright row'], muscles: { sideDelts: 1, traps: 0.5 } },
  { match: ['shrug'], muscles: { traps: 1 } },
  // TRICEPS
  { match: ['tricep pushdown', 'pushdown', 'tricep extension', 'overhead tricep', 'tricep', 'skull crusher', 'kickback'], muscles: { triceps: 1 } },
  { match: ['close grip bench', 'close-grip'], muscles: { triceps: 1, chest: 0.5 } },
  // BICEPS
  { match: ['barbell curl', 'bicep curl', 'dumbbell curl', 'preacher curl', 'curl'], muscles: { biceps: 1, forearms: 0.5 } },
  { match: ['hammer curl'], muscles: { biceps: 1, forearms: 1 } },
  // FOREARMS
  { match: ['wrist curl', 'forearm', 'reverse curl'], muscles: { forearms: 1 } },
  // BACK
  { match: ['deadlift'], muscles: { lowerBack: 1, glutes: 1, hamstrings: 1, traps: 0.5, lats: 0.5 } },
  { match: ['romanian deadlift', 'rdl', 'stiff leg'], muscles: { hamstrings: 1, glutes: 1, lowerBack: 0.5 } },
  { match: ['pull-up', 'pull up', 'pullup', 'chin up', 'chin-up'], muscles: { lats: 1, biceps: 0.5, rearDelts: 0.5 } },
  { match: ['lat pulldown', 'pulldown'], muscles: { lats: 1, biceps: 0.5 } },
  { match: ['barbell row', 'bent over row', 'row', 'dumbbell row', 'cable row', 't-bar', 'seated row'], muscles: { lats: 1, traps: 0.5, rearDelts: 0.5, biceps: 0.5 } },
  { match: ['pullover'], muscles: { lats: 1, chest: 0.5 } },
  // LEGS
  { match: ['squat', 'back squat', 'front squat'], muscles: { quads: 1, glutes: 1, hamstrings: 0.5 } },
  { match: ['leg press'], muscles: { quads: 1, glutes: 0.5 } },
  { match: ['leg extension'], muscles: { quads: 1 } },
  { match: ['leg curl', 'lying curl', 'seated leg curl'], muscles: { hamstrings: 1 } },
  { match: ['lunge', 'split squat', 'bulgarian'], muscles: { quads: 1, glutes: 1, hamstrings: 0.5 } },
  { match: ['hip thrust', 'glute bridge'], muscles: { glutes: 1, hamstrings: 0.5 } },
  { match: ['calf raise', 'calf'], muscles: { calves: 1 } },
  { match: ['hack squat'], muscles: { quads: 1, glutes: 0.5 } },
  // CORE
  { match: ['crunch', 'sit up', 'sit-up', 'plank', 'leg raise', 'ab ', 'cable crunch', 'hanging'], muscles: { abs: 1 } },
];

// Resolve an exercise name to its muscle contributions.
// Returns null if unknown (so user can be asked to tag it).
const getExerciseMuscles = (exerciseName, customMap) => {
  // 1) User-defined override takes priority
  if (customMap && customMap[exerciseName]) return customMap[exerciseName];
  const lower = exerciseName.toLowerCase().trim();
  // 2) Try exact-ish substring matches, longest match wins
  let best = null, bestLen = 0;
  for (const entry of EXERCISE_MUSCLE_MAP) {
    for (const term of entry.match) {
      if (lower.includes(term) && term.length > bestLen) {
        best = entry.muscles; bestLen = term.length;
      }
    }
  }
  return best; // null if nothing matched
};

const STORAGE_KEY = 'heavy-gym-data-v1';
const GYMS_KEY = 'apex-gyms-v1';        // salon listesi
const ACTIVE_GYM_KEY = 'apex-active-gym'; // aktif salon id

// Bir salonun veri anahtarı (localStorage). İlk salon eski anahtarı kullanır (geriye uyumluluk)
function gymStorageKey(gymId) {
  return gymId === 'default' ? STORAGE_KEY : `${STORAGE_KEY}__${gymId}`;
}
// Firestore doküman adı
function gymDocName(gymId) {
  return gymId === 'default' ? 'gym' : `gym_${gymId}`;
}
// Salon listesini oku (yoksa varsayılan tek salon oluştur)
function loadGyms() {
  try {
    const raw = localStorage.getItem(GYMS_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return arr;
    }
  } catch (e) {}
  // İlk kez: mevcut veriyi "1. Salon" olarak tanımla (veri kaybı yok)
  return [{ id: 'default', name: 'Salonum' }];
}
function saveGyms(gyms) {
  try { localStorage.setItem(GYMS_KEY, JSON.stringify(gyms)); } catch (e) {}
}
function loadActiveGymId() {
  try { return localStorage.getItem(ACTIVE_GYM_KEY) || 'default'; } catch (e) { return 'default'; }
}
function saveActiveGymId(id) {
  try { localStorage.setItem(ACTIVE_GYM_KEY, id); } catch (e) {}
}

  Send: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>,
};

const formatDuration = (ms) => {
  if (!ms || ms < 0) return '00:00';
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
};

const formatDurationLong = (ms) => {
  if (!ms || ms < 0) return '—';
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  if (h > 0) return `${h}sa ${m}dk`;
  return `${m}dk`;
};

const haptic = (ms = 30) => { if (navigator.vibrate) navigator.vibrate(ms); };
const dateKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };

// ═══════════════════════════════════════════
// PULL TO REFRESH
// ═══════════════════════════════════════════

function PullToRefresh({ onRefresh, children }) {
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);

  const handleTouchStart = (e) => {
    if (window.scrollY <= 0 && !refreshing) {
      startY.current = e.touches[0].clientY;
      pulling.current = true;
    } else { pulling.current = false; }
  };

  const handleTouchMove = (e) => {
    if (!pulling.current || refreshing) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && window.scrollY <= 0) setPullDistance(Math.min(dy * 0.5, 80));
    else if (dy < -10) { pulling.current = false; setPullDistance(0); }
  };

  const handleTouchEnd = async () => {
    if (!pulling.current) return;
    pulling.current = false;
    if (pullDistance > 55) {
      setRefreshing(true);
      haptic(40);
      try { await onRefresh(); } catch (e) {}
      setRefreshing(false);
      setPullDistance(0);
    } else { setPullDistance(0); }
  };

  const indicatorOpacity = Math.min(pullDistance / 50, 1);
  const indicatorRotation = (pullDistance / 80) * 360;

  return (
    <div onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={() => { pulling.current = false; setPullDistance(0); }}>
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, display: 'flex', justifyContent: 'center', alignItems: 'center', height: refreshing ? 60 : pullDistance, transition: pulling.current ? 'none' : 'height 0.2s ease', overflow: 'hidden', pointerEvents: 'none', zIndex: 10 }}>
        <div style={{ opacity: refreshing ? 1 : indicatorOpacity, color: '#888' }}>
          <div style={{ transform: refreshing ? 'none' : `rotate(${indicatorRotation}deg)` }} className={refreshing ? 'spin' : ''}>
            <Icon.Spinner />
          </div>
        </div>
      </div>
      <div style={{ transform: refreshing ? 'translateY(50px)' : `translateY(${pullDistance}px)`, transition: pulling.current ? 'none' : 'transform 0.2s ease' }}>{children}</div>
    </div>
  );
}

// ═══════════════════════════════════════════
// REORDERABLE LIST (long-press drag)
// ═══════════════════════════════════════════

function ReorderableList({ items, onReorder, renderItem, getKey, gap = 8 }) {
  const [dragIndex, setDragIndex] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const [hoverIndex, setHoverIndex] = useState(null);
  const itemRefs = useRef([]);
  const dragStart = useRef({ y: 0, startY: 0 });
  const longPressTimer = useRef(null);
  const itemHeights = useRef([]);

  const cancelDrag = () => { clearTimeout(longPressTimer.current); setDragIndex(null); setHoverIndex(null); setDragOffset(0); };

  const handleTouchStart = (e, index) => {
    const touch = e.touches[0];
    const startY = touch.clientY;
    dragStart.current = { y: startY, startY };
    longPressTimer.current = setTimeout(() => {
      itemHeights.current = itemRefs.current.map(r => r ? r.offsetHeight + gap : 0);
      setDragIndex(index); setHoverIndex(index); haptic(40);
    }, 350);
  };

  const handleTouchMove = (e) => {
    const touch = e.touches[0];
    if (dragIndex === null) {
      if (Math.abs(touch.clientY - dragStart.current.startY) > 8) clearTimeout(longPressTimer.current);
      return;
    }
    e.preventDefault();
    const dy = touch.clientY - dragStart.current.y;
    setDragOffset(dy);
    let h = dragIndex;
    if (dy > 0) {
      let acc = 0;
      for (let i = dragIndex + 1; i < items.length; i++) {
        acc += itemHeights.current[i] || 0;
        if (dy > acc - itemHeights.current[i] / 2) h = i; else break;
      }
    } else if (dy < 0) {
      let acc = 0;
      for (let i = dragIndex - 1; i >= 0; i--) {
        acc += itemHeights.current[i] || 0;
        if (-dy > acc - itemHeights.current[i] / 2) h = i; else break;
      }
    }
    if (h !== hoverIndex) { setHoverIndex(h); haptic(10); }
  };

  const handleTouchEnd = () => {
    clearTimeout(longPressTimer.current);
    if (dragIndex !== null && hoverIndex !== null && dragIndex !== hoverIndex) {
      const newItems = [...items];
      const [moved] = newItems.splice(dragIndex, 1);
      newItems.splice(hoverIndex, 0, moved);
      onReorder(newItems);
    }
    cancelDrag();
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap }}>
      {items.map((item, index) => {
        const isDragging = dragIndex === index;
        let translateY = 0;
        if (dragIndex !== null && !isDragging) {
          if (dragIndex < hoverIndex && index > dragIndex && index <= hoverIndex) translateY = -(itemHeights.current[dragIndex] || 0);
          else if (dragIndex > hoverIndex && index < dragIndex && index >= hoverIndex) translateY = itemHeights.current[dragIndex] || 0;
        }
        return (
          <div key={getKey ? getKey(item, index) : index} ref={(el) => (itemRefs.current[index] = el)}
            onTouchStart={(e) => handleTouchStart(e, index)} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={cancelDrag}
            style={{ transform: isDragging ? `translateY(${dragOffset}px)` : `translateY(${translateY}px)`, transition: isDragging ? 'none' : 'transform 0.2s ease', touchAction: dragIndex !== null ? 'none' : 'pan-y' }}
            className={isDragging ? 'dragging' : ''}>
            {renderItem(item, index, isDragging)}
          </div>
        );
      })}
    </div>
  );
}

function Confetti({ count = 60 }) {
  const pieces = useMemo(() => {
    const colors = ['#FFD700', '#FF5722', '#2196F3', '#9CCC65', '#AB47BC', '#FF4081', '#fff'];
    return Array.from({ length: count }, (_, i) => ({
      id: i, left: Math.random() * 100, delay: Math.random() * 0.5,
      duration: 2 + Math.random() * 2, color: colors[Math.floor(Math.random() * colors.length)],
      rotate: Math.random() * 360,
    }));
  }, [count]);
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
      {pieces.map(p => <div key={p.id} className="confetti" style={{ left: `${p.left}%`, background: p.color, animationDelay: `${p.delay}s`, animationDuration: `${p.duration}s`, transform: `rotate(${p.rotate}deg)` }} />)}
    </div>
  );
}

function PRCelebration({ weight, reps, exerciseName, type, onClose }) {

  const isTop = type === 'top';

}

// PROGRESS CHART
// ═══════════════════════════════════════════

function ProgressChart({ history, color }) {
  const data = useMemo(() => history.map(s => ({
    date: s.timestamp,
    weight: Math.max(...s.sets.map(set => set.weight)),
  })).reverse(), [history]);

  if (data.length < 2) return null;
  const W = 320, H = 100, PAD_X = 8, PAD_Y = 14;
  const minW = Math.min(...data.map(d => d.weight));
  const maxW = Math.max(...data.map(d => d.weight));
  const range = maxW - minW || 1;
  const minDate = data[0].date, maxDate = data[data.length - 1].date;
  const dateRange = maxDate - minDate || 1;
  const points = data.map(d => ({
    x: PAD_X + ((d.date - minDate) / dateRange) * (W - 2 * PAD_X),
    y: PAD_Y + (1 - (d.weight - minW) / range) * (H - 2 * PAD_Y), w: d.weight,
  }));
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const areaPath = `${path} L ${points[points.length - 1].x} ${H} L ${points[0].x} ${H} Z`;

  return (
    <div style={S.chartCard}>
      <div style={S.chartHeader}>
        <span style={S.chartTitle}>İLERLEME</span>
        <span style={S.chartRange}>{minW}–{maxW}kg · {data.length} antrenman</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
        <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.25" /><stop offset="100%" stopColor={color} stopOpacity="0" /></linearGradient></defs>
        <path d={areaPath} fill="url(#areaGrad)" />
        <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={i === points.length - 1 ? 3.5 : 2} fill={color} />)}
      </svg>
    </div>
  );
}

// MONTHLY CALENDAR

function MonthlyCalendar({ logs, sessions, dayConfig, onTapDay }) {
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });

  const workoutsByDay = useMemo(() => {
    const map = {};
    logs.forEach(l => {
      const k = dateKey(l.timestamp);
      if (!map[k]) map[k] = {};
      if (!map[k][l.dayType]) map[k][l.dayType] = { logs: [], session: null };
      map[k][l.dayType].logs.push(l);
    });
    sessions.forEach(s => {
      const k = dateKey(s.startTime);
      if (!map[k]) map[k] = {};
      if (!map[k][s.dayType]) map[k][s.dayType] = { logs: [], session: null };
      map[k][s.dayType].session = s;
    });
    return map;
  }, [logs, sessions]);

  const year = month.getFullYear(), monthIdx = month.getMonth();
  const firstDay = new Date(year, monthIdx, 1);
  const lastDay = new Date(year, monthIdx + 1, 0);
  const startOffset = (firstDay.getDay() + 6) % 7;

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(year, monthIdx, d);
    const k = `${year}-${monthIdx}-${d}`;
    cells.push({ date, day: d, dateKey: k, workouts: workoutsByDay[k] || {} });
  }
  while (cells.length % 7 !== 0) cells.push(null);

  const todayKey = dateKey(Date.now());

  return (
    <div style={S.calendarCard}>
      <div style={S.calendarHeader}>
        <button onClick={() => setMonth(new Date(year, monthIdx - 1, 1))} style={S.calendarNav}><Icon.Chevron /></button>
        <div style={S.calendarTitle}>{TR_MONTHS[monthIdx]} {year}</div>
        <button onClick={() => setMonth(new Date(year, monthIdx + 1, 1))} style={S.calendarNav}><Icon.ChevR /></button>
      </div>
      <div style={S.calendarGrid}>
        {TR_DAYS.map(d => <div key={d} style={S.calendarDayHead}>{d}</div>)}
        {cells.map((cell, i) => {
          if (!cell) return <div key={i} />;
          const types = Object.keys(cell.workouts);
          const hasWorkout = types.length > 0;
          const isToday = cell.dateKey === todayKey;
          return (
            <button key={i} onClick={() => onTapDay(cell.dateKey)} className="cal-cell"
              style={{ ...S.calendarCell, background: hasWorkout ? '#1a1a1a' : 'transparent', border: isToday ? '1px solid #555' : '1px solid transparent', cursor: 'pointer' }}>
              <div style={{ ...S.calendarDayNum, color: isToday ? '#fff' : (hasWorkout ? '#ccc' : '#555'), fontWeight: isToday ? 800 : 600 }}>{cell.day}</div>
              {hasWorkout && (
                <div style={S.calendarDots}>
                  {types.map(t => <div key={t} style={{ ...S.calendarDot, background: (dayConfig[t]?.accent || '#666') }} />)}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function DayDetailModal({ targetDateKey, data, dayConfig, onClose, onDeleteLog, onDeleteWorkout, onAddWorkout }) {
  const { date, workouts } = useMemo(() => {
    const parts = targetDateKey.split('-').map(Number);
    const d = new Date(parts[0], parts[1], parts[2]);
    const byType = {};
    data.logs.forEach(l => {
      if (dateKey(l.timestamp) !== targetDateKey) return;
      if (!byType[l.dayType]) byType[l.dayType] = { logs: [], session: null };
      byType[l.dayType].logs.push(l);
    });
    data.sessions.forEach(s => {
      if (dateKey(s.startTime) !== targetDateKey) return;
      if (!byType[s.dayType]) byType[s.dayType] = { logs: [], session: null };
      byType[s.dayType].session = s;
    });
    return { date: d, workouts: byType };
  }, [targetDateKey, data]);

  // Compute Top/Back-off PR details and target hit rate for a workout day
  const computeDayStats = (dayLogs) => {
    const isBetter = (a, b) => a.weight > b.weight || (a.weight === b.weight && a.reps > b.reps);
    const bestOf = (sets) => sets.reduce((best, s) => !best || isBetter(s, best) ? s : best, null);

    const byExercise = {};
    dayLogs.forEach(l => { if (!byExercise[l.exerciseName]) byExercise[l.exerciseName] = []; byExercise[l.exerciseName].push(l); });

    const topPRs = []; // { exercise, weight, reps }
    const backoffPRs = [];
    let targetsHit = 0, targetsTotal = 0;
    const dayStart = new Date(date).setHours(0,0,0,0);

    Object.entries(byExercise).forEach(([exName, exLogs]) => {
      const sorted = [...exLogs].sort((a, b) => a.timestamp - b.timestamp);
      const todayTop = sorted[0];
      const todayBackoffs = sorted.slice(1);
      const todayBestBackoff = todayBackoffs.length ? bestOf(todayBackoffs) : null;

      // Prior logs (before this day)
      const priorLogs = data.logs.filter(l => l.exerciseName === exName && l.timestamp < dayStart);
      if (priorLogs.length === 0) return;

      // Categorize prior into top/backoff
      const priorByDay = {};
      priorLogs.forEach(l => { const k = dateKey(l.timestamp); if (!priorByDay[k]) priorByDay[k] = []; priorByDay[k].push(l); });
      const priorTops = [], priorBackoffs = [];
      Object.values(priorByDay).forEach(dl => {
        const ds = [...dl].sort((a, b) => a.timestamp - b.timestamp);
        if (ds[0]) priorTops.push(ds[0]);
        ds.slice(1).forEach(s => priorBackoffs.push(s));
      });
      const priorTopPR = priorTops.length ? bestOf(priorTops) : null;
      const priorBackoffPR = priorBackoffs.length ? bestOf(priorBackoffs) : null;

      // PR check
      if (todayTop && priorTopPR && isBetter(todayTop, priorTopPR)) {
        topPRs.push({ exercise: exName, weight: todayTop.weight, reps: todayTop.reps });
      }
      if (todayBestBackoff && priorBackoffPR && isBetter(todayBestBackoff, priorBackoffPR)) {
        backoffPRs.push({ exercise: exName, weight: todayBestBackoff.weight, reps: todayBestBackoff.reps });
      }

      // Target hit vs last day
      const lastDayLogs = Object.values(priorByDay).sort((a, b) => b[0].timestamp - a[0].timestamp)[0];
      if (!lastDayLogs) return;
      const lastSorted = [...lastDayLogs].sort((a, b) => a.timestamp - b.timestamp);
      const lastTop = lastSorted[0];
      const lastBackoffs = lastSorted.slice(1);
      const lastBestBackoff = lastBackoffs.length ? bestOf(lastBackoffs) : null;

      if (lastTop && todayTop) { targetsTotal++; if (isBetter(todayTop, lastTop)) targetsHit++; }
      if (lastBestBackoff && todayBestBackoff) { targetsTotal++; if (isBetter(todayBestBackoff, lastBestBackoff)) targetsHit++; }
    });

    return { topPRs, backoffPRs, targetsHit, targetsTotal };
  };

  const weekday = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][date.getDay()];
  const todayKey = dateKey(Date.now());
  const isPast = targetDateKey !== todayKey && new Date(date).setHours(0,0,0,0) < new Date().setHours(0,0,0,0);
  const isFuture = new Date(date).setHours(0,0,0,0) > new Date().setHours(0,0,0,0);
  const hasWorkouts = Object.keys(workouts).length > 0;

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={{ ...S.modal, maxWidth: 420 }} onClick={e => e.stopPropagation()}>
        <div style={S.dayDetailDate}>
          <div style={S.dayDetailDay}>{date.getDate()} {TR_MONTHS[date.getMonth()]}</div>
          <div style={S.dayDetailWeekday}>
            {weekday}
            {isPast && <span style={{ color: '#888', marginLeft: 8 }}>· Geçmiş gün</span>}
            {isFuture && <span style={{ color: '#888', marginLeft: 8 }}>· İleri tarih</span>}
          </div>
        </div>

        {Object.entries(workouts).map(([dayType, w]) => {
          const cfg = dayConfig[dayType] || BUILTIN_DAYS.push;
          const duration = w.session?.endTime ? w.session.endTime - w.session.startTime : null;
          const volume = w.logs.reduce((s, l) => s + l.weight * l.reps, 0);
          const dayStats = computeDayStats(w.logs);
          const byExercise = {};
          w.logs.forEach(l => { if (!byExercise[l.exerciseName]) byExercise[l.exerciseName] = []; byExercise[l.exerciseName].push(l); });
          // Sort by timestamp so sets are in order
          Object.values(byExercise).forEach(list => list.sort((a, b) => a.timestamp - b.timestamp));
          return (
            <div key={dayType} style={{ ...S.dayDetailSection, borderColor: cfg.accent }}>
              <div style={{ ...S.dayDetailHeader, background: cfg.gradient }}>
                <span style={S.dayDetailLabel}>{cfg.name} DAY</span>
                <button onClick={() => { if (confirm(`${cfg.name} antrenmanını tamamen silmek istiyor musun?`)) onDeleteWorkout(targetDateKey, dayType); }} style={S.dayDetailDel}>
                  <Icon.Trash />
                </button>
              </div>
              <div style={S.dayDetailStats}>
                <div style={S.dayStatBox}><div style={S.dayStatVal}>{duration ? formatDurationLong(duration) : '—'}</div><div style={S.dayStatLbl}>SÜRE</div></div>
                <div style={S.dayStatBox}><div style={S.dayStatVal}>{w.logs.length}</div><div style={S.dayStatLbl}>SET</div></div>
                <div style={S.dayStatBox}><div style={S.dayStatVal}>{(volume/1000).toFixed(1)}t</div><div style={S.dayStatLbl}>HACİM</div></div>
              </div>
              {(dayStats.topPRs.length > 0 || dayStats.backoffPRs.length > 0 || dayStats.targetsTotal > 0) && (
                <div style={S.dayDetailHighlights}>
                  {dayStats.topPRs.length > 0 && (
                    <div style={{ ...S.dayPRBlock, background: 'rgba(255,215,0,0.08)', borderColor: 'rgba(255,215,0,0.35)' }}>
                      <div style={{ ...S.dayPRBlockLabel, color: '#FFD700' }}>★ TOP REKORLAR ({dayStats.topPRs.length})</div>
                      {dayStats.topPRs.map((pr, i) => (
                        <div key={i} style={S.dayPRBlockRow}>
                          <span style={S.dayPRExName}>{pr.exercise}</span>
                          <span style={{ ...S.dayPRExVal, color: '#FFD700' }}>{pr.weight}kg × {pr.reps}</span>
                        </div>
                      ))}
                    </div>
                  )}
                  {dayStats.backoffPRs.length > 0 && (
                    <div style={{ ...S.dayPRBlock, background: 'rgba(192,192,192,0.06)', borderColor: 'rgba(192,192,192,0.25)' }}>
                      <div style={{ ...S.dayPRBlockLabel, color: '#C0C0C0' }}>★ BACK-OFF REKORLAR ({dayStats.backoffPRs.length})</div>
                      {dayStats.backoffPRs.map((pr, i) => (
                        <div key={i} style={S.dayPRBlockRow}>
                          <span style={S.dayPRExName}>{pr.exercise}</span>
                          <span style={{ ...S.dayPRExVal, color: '#C0C0C0' }}>{pr.weight}kg × {pr.reps}</span>
                        </div>
                      ))}
                    </div>
                  )}
                  {dayStats.targetsTotal > 0 && (
                    <div style={{ ...S.dayTargetChip, background: dayStats.targetsHit === dayStats.targetsTotal ? 'rgba(76,175,80,0.12)' : '#1a1a1a', borderColor: dayStats.targetsHit === dayStats.targetsTotal ? '#4CAF50' : '#2a2a2a', color: dayStats.targetsHit === dayStats.targetsTotal ? '#4CAF50' : '#aaa' }}>
                      🎯 {dayStats.targetsHit}/{dayStats.targetsTotal} hedef tutturuldu
                    </div>
                  )}
                </div>
              )}
              <div style={S.dayDetailExercises}>
                {Object.entries(byExercise).map(([name, list]) => (
                  <div key={name} style={S.dayDetailExercise}>
                    <div style={S.dayDetailExName}>{name}</div>
                    <div style={S.dayDetailExSetList}>
                      {list.map((l, idx) => (
                        <div key={l.id} style={S.dayDetailExSetItem}>
                          <div style={S.dayDetailSetLeft}>
                            <span style={{ ...S.dayDetailSetIdx, color: idx === 0 ? '#FFD700' : '#666' }}>{idx === 0 ? 'T' : idx + 1}</span>
                            <span style={S.dayDetailSetVal}>{l.weight}<span style={S.dayDetailSetUnit}>kg</span> × {l.reps}</span>
                          </div>
                          <button onClick={() => onDeleteLog(l.id)} style={S.dayDetailSetDel}>×</button>
                        </div>
                      ))}
                    </div>

          );

            ))}

        </div>

        <button onClick={onClose} style={{ ...S.modalCancel, marginTop: 12 }}>KAPAT</button>

}

function App() {
  const [tab, setTab] = useState('workout');
  const [authUser, setAuthUser] = useState(undefined); // undefined = yükleniyor, null = giriş yok, obj = giriş var
  const [gyms, setGyms] = useState(loadGyms);
  const [activeGymId, setActiveGymId] = useState(loadActiveGymId);
  const [showGymPicker, setShowGymPicker] = useState(false);

  useEffect(() => {
    if (!window.APEX_FIREBASE_OK || !window.APEX_AUTH) {
      // Firebase yüklenemediyse offline modda devam et (eski davranış)
      setAuthUser(null);
      return;
    }
    const unsub = window.APEX_AUTH.onAuthStateChanged((user) => {
      setAuthUser(user || null);
    });
    return () => unsub && unsub();
  }, []);

  // Giriş yapılınca salon listesini buluttan da çek
  useEffect(() => {
    if (authUser && window.APEX_FIREBASE_OK && window.APEX_DB) {
      window.APEX_DB.collection('users').doc(authUser.uid).collection('data').doc('gyms_meta').get().then((snap) => {
        if (snap.exists && snap.data().gyms && snap.data().gyms.length) {
          setGyms(snap.data().gyms);
          saveGyms(snap.data().gyms);
        }
      }).catch(() => {});
    }
  }, [authUser]);

  const activeGym = gyms.find(g => g.id === activeGymId) || gyms[0];

  const persistGyms = (newGyms) => {
    setGyms(newGyms);
    saveGyms(newGyms);
    if (authUser && window.APEX_FIREBASE_OK && window.APEX_DB) {
      window.APEX_DB.collection('users').doc(authUser.uid).collection('data').doc('gyms_meta').set({ gyms: newGyms }).catch(() => {});
    }
  };

  const selectGym = (id) => {
    setActiveGymId(id);
    saveActiveGymId(id);
    setShowGymPicker(false);
  };

  const addGym = (name) => {
    const id = 'g' + Date.now();
    const newGyms = [...gyms, { id, name: name.trim() || 'Yeni Salon' }];
    persistGyms(newGyms);
    selectGym(id);
  };

  const renameGym = (id, name) => {
    persistGyms(gyms.map(g => g.id === id ? { ...g, name: name.trim() || g.name } : g));
  };

  const deleteGym = (id) => {
    if (gyms.length <= 1) return; // son salon silinemez
    const newGyms = gyms.filter(g => g.id !== id);
    persistGyms(newGyms);
    if (activeGymId === id) selectGym(newGyms[0].id);
    // O salonun verisini de temizle
    try { localStorage.removeItem(gymStorageKey(id)); } catch (e) {}
    if (authUser && window.APEX_FIREBASE_OK && window.APEX_DB) {
      window.APEX_DB.collection('users').doc(authUser.uid).collection('data').doc(gymDocName(id)).delete().catch(() => {});
    }
  };

  // Auth durumu yükleniyor
  if (authUser === undefined) {
    return (
      <div style={{ ...S.app, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center' }}>
          <ApexLogo size={64} />
          <div style={{ color: '#555', fontSize: 13, marginTop: 16, letterSpacing: 1 }}>YÜKLENİYOR...</div>
        </div>
      </div>
    );
  }

  // Giriş yapılmamış → giriş ekranı (Firebase varsa)
  if (authUser === null && window.APEX_FIREBASE_OK) {
    return <AuthScreen />;
  }

  // Giriş yapılmış (veya offline mod) → uygulama
  // key={activeGymId} → salon değişince sekmeler komple yeniden yüklenir (temiz veri)
  return (
    <div style={S.app}>
      <div style={S.content}>
        {tab === 'workout' && <WorkoutTab key={activeGymId} authUser={authUser} activeGym={activeGym} onOpenGymPicker={() => setShowGymPicker(true)} />}
        {tab === 'progress' && <ProgressTab key={activeGymId} authUser={authUser} activeGym={activeGym} onOpenGymPicker={() => setShowGymPicker(true)} />}
      </div>
      <BottomTabs tab={tab} onChange={setTab} />
      {showGymPicker && (
        <GymPickerModal
          gyms={gyms} activeGymId={activeGymId}
          onSelect={selectGym} onAdd={addGym} onRename={renameGym} onDelete={deleteGym}
          onClose={() => setShowGymPicker(false)}
        />
      )}
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const trError = (code) => {
    const map = {
      'auth/invalid-email': 'Geçersiz e-posta adresi',
      'auth/user-not-found': 'Bu e-posta ile kayıt yok',
      'auth/wrong-password': 'Hatalı şifre',
      'auth/invalid-credential': 'E-posta veya şifre hatalı',
      'auth/email-already-in-use': 'Bu e-posta zaten kayıtlı',
      'auth/weak-password': 'Şifre en az 6 karakter olmalı',
      'auth/missing-password': 'Şifre girin',
      'auth/network-request-failed': 'İnternet bağlantısı yok',
      'auth/too-many-requests': 'Çok fazla deneme, biraz bekle',
    };
    return map[code] || 'Bir hata oluştu, tekrar dene';
  };

  const submit = async () => {
    setError('');
    if (!email.trim()) { setError('E-posta girin'); return; }
    if (!password) { setError('Şifre girin'); return; }
    if (mode === 'signup' && !name.trim()) { setError('İsim girin'); return; }
    setBusy(true);
    try {
      if (mode === 'login') {
        await window.APEX_AUTH.signInWithEmailAndPassword(email.trim(), password);
      } else {
        const cred = await window.APEX_AUTH.createUserWithEmailAndPassword(email.trim(), password);
        // İsmi profile + Firestore'a yaz
        if (cred.user) {
          try { await cred.user.updateProfile({ displayName: name.trim() }); } catch (e) {}
          try {
            await window.APEX_DB.collection('users').doc(cred.user.uid).set({
              name: name.trim(), email: email.trim(), createdAt: Date.now()
            }, { merge: true });
          } catch (e) {}
        }
      }
      // onAuthStateChanged otomatik yönlendirir
    } catch (e) {
      setError(trError(e.code));
      setBusy(false);
    }
  };

  return (
    <div style={S.authScreen}>
      <div style={S.authInner}>
        <ApexLogo size={72} />
        <div style={S.authTitle}>APEX</div>
        <div style={S.authSubtitle}>{mode === 'login' ? 'Tekrar hoş geldin' : 'Hesap oluştur'}</div>

        {mode === 'signup' && (
          <input style={S.authInput} placeholder="İsmin" value={name} onChange={e => setName(e.target.value)} type="text" autoCapitalize="sentences" autoCorrect="off" spellCheck="false" />
        )}
        <input style={S.authInput} type="email" placeholder="E-posta" value={email} onChange={e => setEmail(e.target.value)} autoCapitalize="none" autoCorrect="off" />
        <input style={S.authInput} type="password" placeholder="Şifre" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />

        {error && <div style={S.authError}>{error}</div>}

        <button onClick={submit} disabled={busy} style={{ ...S.authSubmit, opacity: busy ? 0.6 : 1 }}>
          {busy ? '...' : (mode === 'login' ? 'GİRİŞ YAP' : 'KAYIT OL')}
        </button>

        <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); }} style={S.authSwitch}>
          {mode === 'login' ? 'Hesabın yok mu? Kayıt ol' : 'Zaten hesabın var mı? Giriş yap'}
        </button>
      </div>
    </div>
  );
}

function WorkoutTab({ authUser, activeGym, onOpenGymPicker }) {
  const [view, setView] = useState('home');
  const [currentDay, setCurrentDay] = useState(null);
  const [currentExercise, setCurrentExercise] = useState(null);
  const [data, setData] = useState({ exercises: DEFAULT_EXERCISES, logs: [], sessions: [], customDays: [] });
  const [showAddExercise, setShowAddExercise] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [prCelebration, setPrCelebration] = useState(null);
  const [toast, setToast] = useState(null);
  const [dayDetailKey, setDayDetailKey] = useState(null);
  const [logDate, setLogDate] = useState(null); // null = today; "YYYY-M-D" string = backdated
  const [sessionSummary, setSessionSummary] = useState(null);
  const [showAddDay, setShowAddDay] = useState(false);
  const [editDayId, setEditDayId] = useState(null); // custom day being edited
  const [cloudLoaded, setCloudLoaded] = useState(false); // bulut verisi yüklendi mi
  const cloudReady = !!(authUser && window.APEX_FIREBASE_OK && window.APEX_DB);
  const gymId = (activeGym && activeGym.id) || 'default';
  const lsKey = gymStorageKey(gymId);
  const docName = gymDocName(gymId);

  // Veri yükleme: önce localStorage (hızlı), sonra bulut (varsa)
  useEffect(() => {
    // 1) localStorage'dan anında yükle (offline + hız)
    let localData = null;
    try {
      const raw = localStorage.getItem(lsKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        localData = { exercises: { ...DEFAULT_EXERCISES, ...(parsed.exercises || {}) }, logs: parsed.logs || [], sessions: parsed.sessions || [], customDays: parsed.customDays || [], customMuscleMap: parsed.customMuscleMap || {} };
        setData(localData);
      } else {
        // Bu salonda hiç veri yok → temiz başla (varsayılan günler, boş loglar)
        setData({ exercises: DEFAULT_EXERCISES, logs: [], sessions: [], customDays: [], customMuscleMap: {} });
      }
    } catch (e) {}

    // 2) Bulutdan yükle (giriş varsa)
    if (cloudReady) {
      const docRef = window.APEX_DB.collection('users').doc(authUser.uid).collection('data').doc(docName);
      docRef.get().then((snap) => {
        if (snap.exists) {
          const cloud = snap.data();
          const merged = { exercises: { ...DEFAULT_EXERCISES, ...(cloud.exercises || {}) }, logs: cloud.logs || [], sessions: cloud.sessions || [], customDays: cloud.customDays || [], customMuscleMap: cloud.customMuscleMap || {} };
          setData(merged);
          try { localStorage.setItem(lsKey, JSON.stringify(merged)); } catch (e) {}
        } else if (localData) {
          docRef.set(localData).catch(() => {});
        }
        setCloudLoaded(true);
      }).catch(() => { setCloudLoaded(true); });
    }
  }, [cloudReady, authUser, gymId]);

  // Build the merged day config (built-in + custom) — used everywhere
  const dayConfig = useMemo(() => buildDayConfigMap(data.customDays), [data.customDays]);

  const saveData = (newData) => {
    setData(newData);
    // Her zaman localStorage'a yaz (offline yedek)
    try { localStorage.setItem(lsKey, JSON.stringify(newData)); } catch (e) {}
    // Giriş varsa buluta da yaz
    if (cloudReady) {
      try {
        window.APEX_DB.collection('users').doc(authUser.uid).collection('data').doc(docName)
          .set(newData).catch(() => {});
      } catch (e) {}
    }
  };

  // Custom day management
  const addCustomDay = (name, subtitle, paletteId, exercises) => {
    const palette = DAY_COLOR_PALETTE.find(p => p.id === paletteId) || DAY_COLOR_PALETTE[0];
    const id = 'custom_' + Date.now().toString(36);
    const newDay = { id, name: name.trim(), subtitle: (subtitle || '').trim(), accent: palette.accent, dark: palette.dark, paletteId: palette.id };
    const newExercises = { ...data.exercises, [id]: exercises || [] };
    saveData({ ...data, customDays: [...(data.customDays || []), newDay], exercises: newExercises });
    setShowAddDay(false);
  };

  const updateCustomDay = (id, name, subtitle, paletteId) => {
    const palette = DAY_COLOR_PALETTE.find(p => p.id === paletteId) || DAY_COLOR_PALETTE[0];
    const newCustomDays = (data.customDays || []).map(d => d.id === id ? { ...d, name: name.trim(), subtitle: (subtitle || '').trim(), accent: palette.accent, dark: palette.dark, paletteId: palette.id } : d);
    saveData({ ...data, customDays: newCustomDays });
    setEditDayId(null);
  };

  const deleteCustomDay = (id) => {
    const newCustomDays = (data.customDays || []).filter(d => d.id !== id);
    const newExercises = { ...data.exercises };
    delete newExercises[id];
    // Also remove logs and sessions for this day type
    const newLogs = data.logs.filter(l => l.dayType !== id);
    const newSessions = data.sessions.filter(s => s.dayType !== id);
    saveData({ ...data, customDays: newCustomDays, exercises: newExercises, logs: newLogs, sessions: newSessions });
    setEditDayId(null);
  };

  // Save a user-defined muscle mapping for an exercise
  const saveMuscleMap = (exerciseName, muscles) => {
    const newMap = { ...(data.customMuscleMap || {}) };
    if (!muscles || Object.keys(muscles).length === 0) {
      delete newMap[exerciseName];
    } else {
      newMap[exerciseName] = muscles;
    }
    saveData({ ...data, customMuscleMap: newMap });
  };

  // Helpers for set categorization (1st set of a day = top, rest = back-off)
  const isBetterSet = (a, b) => a.weight > b.weight || (a.weight === b.weight && a.reps > b.reps);
  const bestOfSets = (sets) => sets.reduce((best, s) => !best || isBetterSet(s, best) ? s : best, null);

  // Group an exercise's logs by day, return { topSets: [], backoffSets: [] } for all-time
  const getCategorizedSets = (exerciseName) => {
    const byDay = {};
    data.logs.filter(l => l.exerciseName === exerciseName).forEach(l => {
      const k = dateKey(l.timestamp);
      if (!byDay[k]) byDay[k] = [];
      byDay[k].push(l);
    });
    const topSets = [], backoffSets = [];
    Object.values(byDay).forEach(dayLogs => {
      const sorted = [...dayLogs].sort((a, b) => a.timestamp - b.timestamp);
      if (sorted[0]) topSets.push(sorted[0]);
      sorted.slice(1).forEach(s => backoffSets.push(s));
    });
    return { topSets, backoffSets };
  };

  const getTopPR = (exerciseName) => {
    const { topSets } = getCategorizedSets(exerciseName);
    return topSets.length ? bestOfSets(topSets) : null;
  };
  const getBackoffPR = (exerciseName) => {
    const { backoffSets } = getCategorizedSets(exerciseName);
    return backoffSets.length ? bestOfSets(backoffSets) : null;
  };

  const addLog = (exerciseName, weight, reps) => {
    const w = parseFloat(weight), r = parseInt(reps);
    let timestamp;
    const targetDayKey = logDate || dateKey(Date.now());
    const existingSetsToday = data.logs.filter(l => l.exerciseName === exerciseName && dateKey(l.timestamp) === targetDayKey).length;
    const setType = existingSetsToday === 0 ? 'top' : 'backoff';

    // Get the relevant PR BEFORE adding the new log
    const previousPR = setType === 'top' ? getTopPR(exerciseName) : getBackoffPR(exerciseName);

    if (logDate) {
      const parts = logDate.split('-').map(Number);
      timestamp = new Date(parts[0], parts[1], parts[2], 12, 0, 0).getTime() + (existingSetsToday * 60000) + Math.floor(Math.random() * 1000);
    } else {
      timestamp = Date.now();
    }
    const newLog = { id: Date.now().toString() + Math.random(), exerciseName, dayType: currentDay, weight: w, reps: r, timestamp };
    saveData({ ...data, logs: [...data.logs, newLog] });

    // Only celebrate PR for today's entries; need at least one prior PR in the same category
    if (!logDate && previousPR) {
      const newSet = { weight: w, reps: r };
      const isNewPR = isBetterSet(newSet, previousPR);
      if (isNewPR) {
        setPrCelebration({ weight: w, reps: r, exerciseName, type: setType });
      }
    }
  };

  const deleteLog = (id) => saveData({ ...data, logs: data.logs.filter(l => l.id !== id) });

  const deleteWorkoutDay = (targetDateKey, dayType) => {
    const newLogs = data.logs.filter(l => !(dateKey(l.timestamp) === targetDateKey && l.dayType === dayType));
    const newSessions = data.sessions.filter(s => !(dateKey(s.startTime) === targetDateKey && s.dayType === dayType));
    saveData({ ...data, logs: newLogs, sessions: newSessions });
  };

  const addExercise = (name) => {
    if (!name.trim()) return;
    saveData({ ...data, exercises: { ...data.exercises, [currentDay]: [...(data.exercises[currentDay] || []), name.trim()] } });
  };

  const removeExercise = (name) => saveData({ ...data, exercises: { ...data.exercises, [currentDay]: data.exercises[currentDay].filter(e => e !== name) } });
  const reorderExercises = (newOrder) => saveData({ ...data, exercises: { ...data.exercises, [currentDay]: newOrder } });
  const getActiveSession = () => data.sessions.find(s => s.dayType === currentDay && !s.endTime);

  const startSession = () => {
    const newSession = { id: Date.now().toString(), dayType: currentDay, startTime: Date.now(), endTime: null };
    saveData({ ...data, sessions: [...data.sessions, newSession] });
    haptic(50);
  };

  const endSession = () => {
    const active = getActiveSession();
    if (!active) return;
    const endTime = Date.now();
    const updatedSessions = data.sessions.map(s => s.id === active.id ? { ...s, endTime } : s);
    const newData = { ...data, sessions: updatedSessions };
    saveData(newData);
    haptic([30, 30, 50]);

    // Build summary
    const endedSession = { ...active, endTime };
    const summary = computeSessionSummary(endedSession, newData);
    if (summary.setCount === 0) {
      setToast(`Antrenman kaydedildi · ${formatDurationLong(endTime - active.startTime)}`);
    } else {
      setSessionSummary(summary);
    }
  };

  const computeSessionSummary = (session, src) => {
    const isBetter = (a, b) => a.weight > b.weight || (a.weight === b.weight && a.reps > b.reps);
    const bestOf = (sets) => sets.reduce((best, s) => !best || isBetter(s, best) ? s : best, null);

    // Categorize all logs of an exercise into top + backoff (1st set of a day = top, rest = backoff)
    const categorize = (logs) => {
      const byDay = {};
      logs.forEach(l => { const k = dateKey(l.timestamp); if (!byDay[k]) byDay[k] = []; byDay[k].push(l); });
      const tops = [], backs = [];
      Object.values(byDay).forEach(dayLogs => {
        const sorted = [...dayLogs].sort((a, b) => a.timestamp - b.timestamp);
        if (sorted[0]) tops.push(sorted[0]);
        sorted.slice(1).forEach(s => backs.push(s));
      });
      return { tops, backs };
    };

    const sessionLogs = src.logs.filter(l => l.timestamp >= session.startTime && l.timestamp <= session.endTime);
    const totalTonnage = sessionLogs.reduce((s, l) => s + l.weight * l.reps, 0);
    const duration = session.endTime - session.startTime;

    // Previous session of same day type
    const previousSession = src.sessions
      .filter(s => s.dayType === session.dayType && s.id !== session.id && s.endTime)
      .sort((a, b) => b.startTime - a.startTime)[0];
    let previousTonnage = null;
    if (previousSession) {
      const prevLogs = src.logs.filter(l => l.timestamp >= previousSession.startTime && l.timestamp <= previousSession.endTime);
      previousTonnage = prevLogs.reduce((s, l) => s + l.weight * l.reps, 0);
    }

    const exercisesToday = [...new Set(sessionLogs.map(l => l.exerciseName))];
    const prs = []; // each: { exercise, weight, reps, type: 'top'|'backoff' }
    let targetsHit = 0, targetsTotal = 0;

    exercisesToday.forEach(exName => {
      const exSessionLogs = sessionLogs.filter(l => l.exerciseName === exName).sort((a, b) => a.timestamp - b.timestamp);
      const todayTop = exSessionLogs[0];
      const todayBackoffs = exSessionLogs.slice(1);
      const todayBestBackoff = todayBackoffs.length ? bestOf(todayBackoffs) : null;

      // All prior logs of this exercise before this session
      const allPriorLogs = src.logs.filter(l => l.exerciseName === exName && l.timestamp < session.startTime);
      const { tops: priorTops, backs: priorBacks } = categorize(allPriorLogs);
      const priorTopPR = priorTops.length ? bestOf(priorTops) : null;
      const priorBackoffPR = priorBacks.length ? bestOf(priorBacks) : null;

      // TOP PR check
      if (todayTop && priorTopPR && isBetter(todayTop, priorTopPR)) {
        prs.push({ exercise: exName, weight: todayTop.weight, reps: todayTop.reps, type: 'top' });
      }
      // BACK-OFF PR check
      if (todayBestBackoff && priorBackoffPR && isBetter(todayBestBackoff, priorBackoffPR)) {
        prs.push({ exercise: exName, weight: todayBestBackoff.weight, reps: todayBestBackoff.reps, type: 'backoff' });
      }

      // Target hit: compare today's top to last workout day's top, today's backoff to last workout day's backoff
      if (allPriorLogs.length === 0) return;
      const priorByDay = {};
      allPriorLogs.forEach(l => { const k = dateKey(l.timestamp); if (!priorByDay[k]) priorByDay[k] = []; priorByDay[k].push(l); });
      const lastDayLogs = Object.values(priorByDay).sort((a, b) => b[0].timestamp - a[0].timestamp)[0];
      if (!lastDayLogs) return;
      const lastDaySorted = [...lastDayLogs].sort((a, b) => a.timestamp - b.timestamp);
      const lastDayTop = lastDaySorted[0];
      const lastDayBackoffs = lastDaySorted.slice(1);
      const lastDayBestBackoff = lastDayBackoffs.length ? bestOf(lastDayBackoffs) : null;

      if (lastDayTop && todayTop) {
        targetsTotal++;
        if (isBetter(todayTop, lastDayTop)) targetsHit++;
      }
      if (lastDayBestBackoff && todayBestBackoff) {
        targetsTotal++;
        if (isBetter(todayBestBackoff, lastDayBestBackoff)) targetsHit++;
      }
    });

    // This week's day type distribution
    const weekStart = Date.now() - 7 * 86400000;
    const weekLogs = src.logs.filter(l => l.timestamp >= weekStart);
    const weekDistribution = { push: new Set(), pull: new Set(), upper: new Set(), leg: new Set() };
    weekLogs.forEach(l => weekDistribution[l.dayType]?.add(dateKey(l.timestamp)));

    return {
      dayType: session.dayType,
      duration,
      totalTonnage,
      previousTonnage,
      tonnageDiff: previousTonnage > 0 ? ((totalTonnage - previousTonnage) / previousTonnage) * 100 : null,
      prs,
      targetsHit, targetsTotal,
      setCount: sessionLogs.length,
      weekDistribution: {
        push: weekDistribution.push.size,
        pull: weekDistribution.pull.size,
        upper: weekDistribution.upper.size,
        leg: weekDistribution.leg.size,
      },
    };
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `apex-backup-${new Date().toISOString().split('T')[0]}.json`; a.click();
    URL.revokeObjectURL(url);
    setShowMenu(false);
  };

  const importData = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imp = JSON.parse(ev.target.result);
          if (imp.exercises && imp.logs) {
            saveData({ exercises: { ...DEFAULT_EXERCISES, ...imp.exercises }, logs: imp.logs, sessions: imp.sessions || [], customDays: imp.customDays || [], customMuscleMap: imp.customMuscleMap || {} });
            alert('Yedek yüklendi!');
          }
        } catch { alert('Dosya okunamadı.'); }
      };
      reader.readAsText(file);
    };
    input.click();
    setShowMenu(false);
  };

  const getLastPerformance = (exerciseName) => {
    const logs = data.logs.filter(l => l.exerciseName === exerciseName).sort((a, b) => b.timestamp - a.timestamp);
    if (logs.length === 0) return null;
    const lastDate = new Date(logs[0].timestamp).toDateString();
    return { date: logs[0].timestamp, sets: logs.filter(l => new Date(l.timestamp).toDateString() === lastDate).sort((a, b) => a.timestamp - b.timestamp) };
  };

  const getHistoryGrouped = (exerciseName) => {
    const logs = data.logs.filter(l => l.exerciseName === exerciseName).sort((a, b) => b.timestamp - a.timestamp);
    const grouped = {};
    logs.forEach(log => { const d = new Date(log.timestamp).toDateString(); if (!grouped[d]) grouped[d] = []; grouped[d].push(log); });
    return Object.entries(grouped).map(([date, list]) => ({ date, timestamp: list[0].timestamp, sets: list.sort((a, b) => a.timestamp - b.timestamp) }));
  };

  const startBackdatedWorkout = (targetDateKey, dayType) => {
    const todayKey = dateKey(Date.now());
    setCurrentDay(dayType);
    setLogDate(targetDateKey === todayKey ? null : targetDateKey);
    setDayDetailKey(null);
    setView('day');
  };

  return (
    <>
      {view === 'home' && <HomeView onSelectDay={(d) => { setCurrentDay(d); setLogDate(null); setView('day'); }} data={data} dayConfig={dayConfig} onMenu={() => setShowMenu(true)} onTapCalendarDay={setDayDetailKey} onAddDay={() => setShowAddDay(true)} onEditDay={setEditDayId} onSaveMuscleMap={saveMuscleMap} activeGym={activeGym} onOpenGymPicker={onOpenGymPicker} />}
      {view === 'day' && <DayView dayType={currentDay} cfg={dayConfig[currentDay]} exercises={data.exercises[currentDay] || []} logsForDay={data.logs} getLastPerformance={getLastPerformance} activeSession={getActiveSession()} onStartSession={startSession} onEndSession={endSession} onBack={() => { setView('home'); setLogDate(null); }} onSelectExercise={(e) => { setCurrentExercise(e); setView('exercise'); }} onAddExercise={() => setShowAddExercise(true)} onRemoveExercise={removeExercise} onReorderExercises={reorderExercises} logDate={logDate} />}
      {view === 'exercise' && <ExerciseView exerciseName={currentExercise} cfg={dayConfig[currentDay]} history={getHistoryGrouped(currentExercise)} onBack={() => setView('day')} onAddLog={(w, r) => addLog(currentExercise, w, r)} onDeleteLog={deleteLog} logDate={logDate} />}
      {showAddExercise && <AddExerciseModal cfg={dayConfig[currentDay]} existingExercises={data.exercises} dayConfig={dayConfig} currentDayId={currentDay} onClose={() => setShowAddExercise(false)} onAdd={(n) => { addExercise(n); setShowAddExercise(false); }} />}
      {showMenu && <MenuModal onClose={() => setShowMenu(false)} onExport={exportData} onImport={importData} authUser={authUser} />}
      {showAddDay && <DayEditorModal onClose={() => setShowAddDay(false)} onSave={addCustomDay} existingExercises={data.exercises} dayConfig={dayConfig} />}
      {editDayId && <DayEditorModal editingDay={data.customDays.find(d => d.id === editDayId)} onClose={() => setEditDayId(null)} onSave={(name, sub, pal) => updateCustomDay(editDayId, name, sub, pal)} onDelete={() => { if (confirm('Bu günü ve tüm kayıtlarını silmek istiyor musun?')) deleteCustomDay(editDayId); }} />}
      {prCelebration && <PRCelebration {...prCelebration} cfg={dayConfig[prCelebration.dayType] || dayConfig[currentDay]} onClose={() => setPrCelebration(null)} />}
      {dayDetailKey && <DayDetailModal targetDateKey={dayDetailKey} data={data} dayConfig={dayConfig} onClose={() => setDayDetailKey(null)} onDeleteLog={deleteLog} onDeleteWorkout={deleteWorkoutDay} onAddWorkout={startBackdatedWorkout} />}
      {sessionSummary && <SessionSummaryModal summary={sessionSummary} dayConfig={dayConfig} onClose={() => setSessionSummary(null)} />}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </>
  );
}

function SixMonthStats({ logs, sessions }) {
  const [selectedIdx, setSelectedIdx] = useState(null);

  // Build last 6 months (including current), oldest → newest
  const months = useMemo(() => {
    const now = new Date();
    const arr = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const year = d.getFullYear(), month = d.getMonth();
      // Workout days this month (unique dateKeys from logs)
      const dayKeys = new Set();
      logs.forEach(l => {
        const ld = new Date(l.timestamp);
        if (ld.getFullYear() === year && ld.getMonth() === month) dayKeys.add(dateKey(l.timestamp));
      });
      // Total duration from completed sessions this month
      let totalMs = 0;
      sessions.forEach(s => {
        if (!s.endTime) return;
        const sd = new Date(s.startTime);
        if (sd.getFullYear() === year && sd.getMonth() === month) totalMs += (s.endTime - s.startTime);
      });
      // PR count this month (top + backoff) — compute by walking exercises
      arr.push({ year, month, days: dayKeys.size, totalMs, label: TR_MONTHS_SHORT[month] });
    }
    return arr;
  }, [logs, sessions]);

  const maxDays = Math.max(...months.map(m => m.days), 1);
  const isCurrentMonth = (m) => { const n = new Date(); return m.year === n.getFullYear() && m.month === n.getMonth(); };

  const selected = selectedIdx != null ? months[selectedIdx] : null;

  return (
    <div style={{ marginTop: 28 }}>
      <div style={S.sectionLabel}>SON 6 AY</div>
      <div style={S.statsCard}>
        <div style={S.barChartRow}>
          {months.map((m, i) => {
            const heightPct = (m.days / maxDays) * 100;
            const active = isCurrentMonth(m);
            const isSelected = selectedIdx === i;
            return (
              <button key={i} onClick={() => setSelectedIdx(isSelected ? null : i)} style={S.barColumn}>
                <div style={{ ...S.barCount, color: isSelected ? '#FF3D3D' : (active ? '#FF3D3D' : '#888'), fontWeight: (active || isSelected) ? 800 : 600 }}>{m.days}</div>
                <div style={S.barTrack}>
                  <div style={{ ...S.barFill, height: `${Math.max(heightPct, 4)}%`, background: isSelected ? '#FF3D3D' : (active ? '#FF3D3D' : '#5a1f1f'), opacity: isSelected || active ? 1 : 0.7 }} />
                </div>
                <div style={{ ...S.barLabel, color: isSelected ? '#FF3D3D' : (active ? '#fff' : '#888'), fontWeight: (active || isSelected) ? 800 : 600 }}>{m.label}</div>
              </button>
            );
          })}
        </div>

        {selected ? (
          <div style={S.statsDetail}>
            <div style={S.statsDetailTitle}>{TR_MONTHS[selected.month]} {selected.year}</div>
            <div style={S.statsDetailRow}>
              <div style={S.statsDetailBox}>
                <div style={S.statsDetailVal}>{selected.days}</div>
                <div style={S.statsDetailLbl}>ANTRENMAN GÜNÜ</div>
              </div>
              <div style={S.statsDetailBox}>
                <div style={S.statsDetailVal}>{selected.totalMs > 0 ? formatDurationLong(selected.totalMs) : '—'}</div>
                <div style={S.statsDetailLbl}>TOPLAM SÜRE</div>
              </div>
            </div>
          </div>
        ) : (
          <div style={S.statsHint}>Detay için bir aya dokun</div>
        )}
      </div>
    </div>
  );
}

function MuscleHeatmap({ logs, customMuscleMap, dayConfig, onSaveMuscleMap }) {
  const [view, setView] = useState('front');
  const [selectedMuscle, setSelectedMuscle] = useState(null);
  const [metric, setMetric] = useState('sets');
  const [tagging, setTagging] = useState(null); // exercise name being tagged
  const [detailPeriod, setDetailPeriod] = useState('week'); // 'week' | 'month'

  // Accumulate muscle work over a time window
  const accumulate = (sinceTs) => {
    const recent = logs.filter(l => l.timestamp >= sinceTs);
    const acc = {};
    Object.keys(MUSCLES).forEach(m => { acc[m] = { sets: 0, volume: 0 }; });
    const unknownNames = new Set();
    recent.forEach(l => {
      const muscles = getExerciseMuscles(l.exerciseName, customMuscleMap);
      if (!muscles) { unknownNames.add(l.exerciseName); return; }
      const vol = l.weight * l.reps;
      Object.entries(muscles).forEach(([m, weight]) => {
        if (!acc[m]) return;
        acc[m].sets += weight;
        acc[m].volume += vol * weight;
      });
    });
    return { acc, unknownNames: [...unknownNames] };
  };

  const weekData = useMemo(() => accumulate(Date.now() - 7 * 86400000), [logs, customMuscleMap]);
  const monthData = useMemo(() => {
    const d = new Date(); const monthStart = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    return accumulate(monthStart);
  }, [logs, customMuscleMap]);

  const { acc, unknownNames } = weekData;
  const maxVal = Math.max(...Object.values(acc).map(a => a[metric]), 1);

  const muscleColor = (muscleKey) => {
    const val = acc[muscleKey]?.[metric] || 0;
    if (val === 0) return '#1a1a1a';
    const intensity = val / maxVal;
    const r = Math.round(80 + intensity * 175);
    const g = Math.round(20 + intensity * 40);
    const b = Math.round(20 + intensity * 20);
    return `rgb(${r},${g},${b})`;
  };

  const muscleStatus = (sets) => {
    if (sets === 0) return { label: 'Çalışılmadı', color: '#555' };
    if (sets < 6) return { label: 'Düşük hacim', color: '#FFA726' };
    if (sets <= 20) return { label: 'İdeal aralık', color: '#4CAF50' };
    return { label: 'Yüksek hacim', color: '#FF5252' };
  };

  const imbalances = useMemo(() => {
    const out = [];
    const pairs = [
      ['chest', 'lats', 'Göğüs', 'Sırt'],
      ['quads', 'hamstrings', 'Quad', 'Hamstring'],
      ['biceps', 'triceps', 'Biceps', 'Triceps'],
      ['frontDelts', 'rearDelts', 'Ön Omuz', 'Arka Omuz'],
    ];
    pairs.forEach(([a, b, la, lb]) => {
      const va = acc[a]?.sets || 0, vb = acc[b]?.sets || 0;
      if (va + vb < 4) return;
      const ratio = va / (vb || 0.5);
      if (ratio >= 2) out.push(`${la}, ${lb}'den ~${ratio.toFixed(1)}x fazla çalışılmış`);
      else if (ratio <= 0.5) out.push(`${lb}, ${la}'den ~${(1 / ratio).toFixed(1)}x fazla çalışılmış`);
    });
    return out;
  }, [acc]);

  const workedMuscles = Object.keys(MUSCLES)
    .map(k => ({ key: k, ...acc[k], ...MUSCLES[k] }))
    .filter(m => m.sets > 0)
    .sort((a, b) => b[metric] - a[metric]);

  const fmtVal = (m) => metric === 'sets' ? `${(acc[m]?.sets || 0).toFixed(1)} set` : `${((acc[m]?.volume || 0) / 1000).toFixed(1)}t`;

  // Build per-muscle breakdown for the expanding detail (which days/exercises)
  const buildMuscleDetail = (muscleKey, sinceTs) => {
    const recent = logs.filter(l => l.timestamp >= sinceTs);
    const byExercise = {}; // exerciseName -> { sets, volume }
    const byDay = {};      // dateKey -> { dayType, sets }
    recent.forEach(l => {
      const muscles = getExerciseMuscles(l.exerciseName, customMuscleMap);
      if (!muscles || !muscles[muscleKey]) return;
      const w = muscles[muscleKey];
      if (!byExercise[l.exerciseName]) byExercise[l.exerciseName] = { sets: 0, volume: 0 };
      byExercise[l.exerciseName].sets += w;
      byExercise[l.exerciseName].volume += l.weight * l.reps * w;
      const k = dateKey(l.timestamp);
      if (!byDay[k]) byDay[k] = { dayType: l.dayType, sets: 0, ts: l.timestamp };
      byDay[k].sets += w;
    });
    const exercises = Object.entries(byExercise).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.sets - a.sets);
    const days = Object.entries(byDay).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => b.ts - a.ts);
    const totalSets = exercises.reduce((s, e) => s + e.sets, 0);
    const totalVol = exercises.reduce((s, e) => s + e.volume, 0);
    return { exercises, days, totalSets, totalVol };
  };

  const detailSince = detailPeriod === 'week' ? Date.now() - 7 * 86400000 : new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
  const muscleDetail = selectedMuscle ? buildMuscleDetail(selectedMuscle, detailSince) : null;

  return (
    <div style={{ marginTop: 28 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={S.sectionLabel}>KAS HARİTASI · SON 7 GÜN</div>
        <div style={S.heatmapMetricToggle}>
          <button onClick={() => setMetric('sets')} style={{ ...S.heatmapMetricBtn, ...(metric === 'sets' ? S.heatmapMetricBtnActive : {}) }}>SET</button>
          <button onClick={() => setMetric('volume')} style={{ ...S.heatmapMetricBtn, ...(metric === 'volume' ? S.heatmapMetricBtnActive : {}) }}>HACİM</button>
        </div>
      </div>
      <div style={S.statsCard}>
        <div style={S.bodyViewToggle}>
          <button onClick={() => setView('front')} style={{ ...S.bodyViewBtn, ...(view === 'front' ? S.bodyViewBtnActive : {}) }}>ÖN</button>
          <button onClick={() => setView('back')} style={{ ...S.bodyViewBtn, ...(view === 'back' ? S.bodyViewBtnActive : {}) }}>ARKA</button>
        </div>
        <div style={S.bodyContainer}>
          {view === 'front'
            ? <BodyFront muscleColor={muscleColor} onTap={setSelectedMuscle} selected={selectedMuscle} />
            : <BodyBack muscleColor={muscleColor} onTap={setSelectedMuscle} selected={selectedMuscle} />}
        </div>

        {imbalances.length > 0 && (
          <div style={S.imbalanceBox}>
            <div style={S.imbalanceTitle}>⚠ DENGE UYARISI</div>
            {imbalances.map((im, i) => <div key={i} style={S.imbalanceRow}>{im}</div>)}
          </div>
        )}

        {workedMuscles.length > 0 ? (
          <div style={S.muscleBreakdown}>
            {workedMuscles.map(m => {
              const pct = (m[metric] / maxVal) * 100;
              const st = muscleStatus(acc[m.key].sets);
              const isOpen = selectedMuscle === m.key;
              return (
                <div key={m.key}>
                  <button onClick={() => { setSelectedMuscle(isOpen ? null : m.key); }} style={{ ...S.muscleBreakRow, ...(isOpen ? { background: '#161616' } : {}) }}>
                    <span style={S.muscleBreakName}>{isOpen ? '▼ ' : ''}{m.tr}</span>
                    <div style={S.muscleBreakBarTrack}>
                      <div style={{ ...S.muscleBreakBarFill, width: `${pct}%`, background: muscleColor(m.key) }} />
                    </div>
                    <span style={{ ...S.muscleBreakVal, color: st.color }}>{fmtVal(m.key)}</span>
                  </button>
                  {isOpen && muscleDetail && (
                    <div style={S.muscleExpand}>

function MuscleTagModal({ exerciseName, existing, isAuto, onClose, onSave }) {
  // muscles: { key: 1 (primary) | 0.5 (secondary) }
  const [muscles, setMuscles] = useState(existing ? { ...existing } : {});

  // tap cycle: none -> primary(1) -> secondary(0.5) -> none
  const cycle = (key) => {
    setMuscles(prev => {
      const cur = prev[key];
      const next = { ...prev };
      if (!cur) next[key] = 1;
      else if (cur === 1) next[key] = 0.5;
      else delete next[key];
      return next;
    });
  };

  const labelFor = (v) => v === 1 ? 'Birincil' : v === 0.5 ? 'İkincil' : '';
  const colorFor = (v) => v === 1 ? '#FF3D3D' : v === 0.5 ? '#FFA726' : '#1f1f1f';

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={{ ...S.modal, maxWidth: 400 }} onClick={e => e.stopPropagation()}>
        <div style={S.modalTitle}>{exerciseName}</div>
        {isAuto && <div style={S.autoTagNotice}>Bu egzersiz otomatik tanınıyor. Yanlışsa düzeltebilirsin.</div>}
        <div style={S.tagHint}>Çalıştırdığı kaslara dokun. Bir kez = birincil (tam), iki kez = ikincil (yarım), üç kez = kaldır.</div>
        <div style={S.tagGrid}>
          {Object.entries(MUSCLES).map(([key, m]) => {
            const v = muscles[key];
            return (
              <button key={key} onClick={() => cycle(key)} style={{ ...S.tagChip, borderColor: colorFor(v), color: v ? '#fff' : '#888', background: v ? `${colorFor(v)}22` : '#0f0f0f' }}>
                {m.tr}
                {v && <span style={{ ...S.tagChipBadge, color: colorFor(v) }}>{labelFor(v)}</span>}
              </button>
            );
          })}
        </div>
        <div style={{ ...S.modalActions, marginTop: 16 }}>
          <button onClick={onClose} style={S.modalCancel}>İPTAL</button>
          <button onClick={() => onSave(muscles)} style={{ ...S.modalConfirm, background: Object.keys(muscles).length ? 'linear-gradient(135deg,#FF3D3D,#8B1111)' : '#2a2a2a', color: Object.keys(muscles).length ? '#fff' : '#666' }}>KAYDET</button>
        </div>
        <button onClick={() => onSave(null)} style={S.resetAutoBtn}>↺ Otomatik tanımaya sıfırla</button>
      </div>
    </div>
  );
}

function ExerciseView({ exerciseName, cfg, history, onBack, onAddLog, onDeleteLog, logDate }) {
  const [weight, setWeight] = useState('');
  const [reps, setReps] = useState('');
  const weightRef = useRef(null);
  const isBackdated = !!logDate;
  let backdatedLabel = '';
  if (isBackdated) {
    const parts = logDate.split('-').map(Number);
    const d = new Date(parts[0], parts[1], parts[2]);
    backdatedLabel = `${d.getDate()} ${TR_MONTHS[d.getMonth()]}`;
  }

  // Helpers
  const isBetterSet = (a, b) => a.weight > b.weight || (a.weight === b.weight && a.reps > b.reps);
  const bestOfSets = (sets) => sets.reduce((best, s) => !best || isBetterSet(s, best) ? s : best, null);

  // Build categorized data (Top vs Back-off) across all history
  // history is { date, timestamp, sets: [...] } per day, sorted newest first
  // Each day's first set (by timestamp) = top, rest = back-off
  const topAllTime = [], backoffAllTime = [];
  history.forEach(h => {
    const sorted = [...h.sets].sort((a, b) => a.timestamp - b.timestamp);
    if (sorted[0]) topAllTime.push(sorted[0]);
    sorted.slice(1).forEach(s => backoffAllTime.push(s));
  });
  const topPR = topAllTime.length ? bestOfSets(topAllTime) : null;
  const backoffPR = backoffAllTime.length ? bestOfSets(backoffAllTime) : null;

  // Target system: from previous workout day
  const todayOrLogKey = logDate || dateKey(Date.now());
  const targetTimestamp = logDate
    ? (() => { const p = logDate.split('-').map(Number); return new Date(p[0], p[1], p[2]).setHours(0,0,0,0); })()
    : new Date().setHours(0,0,0,0);

  const previousEntry = history.find(h => h.timestamp < targetTimestamp);
  let targetTop = null, targetBackoff = null;
  if (previousEntry) {
    const sorted = [...previousEntry.sets].sort((a, b) => a.timestamp - b.timestamp);
    targetTop = sorted[0] || null;
    const backSets = sorted.slice(1);
    targetBackoff = backSets.length ? bestOfSets(backSets) : null;
  }

  // Today's sets (in order)
  const todayEntry = history.find(h => dateKey(h.timestamp) === todayOrLogKey);
  const todaySorted = todayEntry ? [...todayEntry.sets].sort((a, b) => a.timestamp - b.timestamp) : [];
  const todayTop = todaySorted[0] || null;
  const todayBackoffs = todaySorted.slice(1);
  const todayBestBackoff = todayBackoffs.length ? bestOfSets(todayBackoffs) : null;

  const topBeaten = !!(todayTop && targetTop && isBetterSet(todayTop, targetTop));
  const backoffBeaten = !!(todayBestBackoff && targetBackoff && isBetterSet(todayBestBackoff, targetBackoff));

  // Dynamic: show top focus if no sets yet today; backoff focus once first set is in
  const showingBackoff = todaySorted.length > 0;

  const handleSubmit = () => {
    if (!weight || !reps) return;
    const normalizedWeight = weight.replace(',', '.');
    const w = parseFloat(normalizedWeight);
    if (!w || w <= 0) return;
    onAddLog(normalizedWeight, reps);
    setWeight(''); setReps('');
    weightRef.current?.focus();
  };

  const formatDate = (ts) => {
    const d = new Date(ts), today = new Date();
    const diff = Math.floor((today - d) / 86400000);
    if (diff === 0) return 'Bugün';
    if (diff === 1) return 'Dün';
    if (diff < 7) return `${diff} gün önce`;
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
  };

  return (
    <div style={S.screen}>
      <div style={S.topBar}>
        <button onClick={onBack} style={S.iconBtn}><Icon.Chevron /></button>
        <div style={{ ...S.topBarTitle, color: '#fff', fontSize: 17 }}>{exerciseName}</div>
        <div style={{ width: 60 }} />
      </div>

      {/* TWO PRs: TOP + BACK-OFF */}
      {(topPR || backoffPR) && (
        <div style={{ ...S.prBoxDual, borderColor: cfg.accent, background: cfg.accentSoft }}>
          <div style={S.prDualRow}>
            <span style={S.prDualLabel}>TOP REKOR</span>
            <span style={S.prDualValue}>{topPR ? `${topPR.weight}kg × ${topPR.reps}` : '—'}</span>
          </div>
          <div style={{ ...S.prDualRow, borderTop: '1px solid rgba(255,255,255,0.06)' }}>
            <span style={S.prDualLabel}>BACK-OFF REKOR</span>
            <span style={S.prDualValue}>{backoffPR ? `${backoffPR.weight}kg × ${backoffPR.reps}` : '—'}</span>
          </div>
        </div>
      )}

      {/* DYNAMIC TARGET CARD */}
      {!showingBackoff && targetTop ? (
        // Phase 1: no sets yet → focus on TOP
        <div style={{ ...S.targetCard, borderColor: topBeaten ? '#4CAF50' : '#FF5252', background: topBeaten ? 'rgba(76,175,80,0.08)' : 'rgba(255,82,82,0.06)' }}>
          <div style={S.targetLabel}>TOP SET — YENMEN GEREKEN</div>
          <div style={{ ...S.targetValue, color: topBeaten ? '#4CAF50' : '#FF5252' }}>
            {targetTop.weight}<span style={S.targetUnit}>kg</span> × {targetTop.reps}
          </div>
          <div style={S.targetStatus}>İlk setin senin ana setin. Bunu yendiğin anda back-off hedefine geçeriz.</div>
        </div>
      ) : showingBackoff ? (
        // Phase 2+: focus on BACK-OFF, show top status compact
        <div style={{ ...S.targetCard, borderColor: backoffBeaten ? '#4CAF50' : (targetBackoff ? '#FF5252' : '#1f1f1f'), background: backoffBeaten ? 'rgba(76,175,80,0.08)' : (targetBackoff ? 'rgba(255,82,82,0.06)' : '#0f0f0f') }}>
          {/* Top set status compact strip */}
          <div style={S.targetTopStrip}>
            {topBeaten ? (
              <><span style={{ color: '#4CAF50' }}>✓</span> TOP YENDİN — {todayTop.weight}kg × {todayTop.reps} <span style={{ color: '#666' }}>(hedef: {targetTop.weight}×{targetTop.reps})</span></>
            ) : targetTop ? (
              <><span style={{ color: '#FF5252' }}>✗</span> TOP yenmedi — {todayTop.weight}kg × {todayTop.reps} <span style={{ color: '#666' }}>(hedef: {targetTop.weight}×{targetTop.reps})</span></>
            ) : (
              <><span style={{ color: '#888' }}>●</span> İLK TOP — {todayTop.weight}kg × {todayTop.reps}</>
            )}
          </div>
          {/* Back-off focus */}
          {targetBackoff ? (
            <>
              <div style={{ ...S.targetLabel, marginTop: 12 }}>{backoffBeaten ? '✓ BACK-OFF YENDİN' : 'BACK-OFF — YENMEN GEREKEN'}</div>
              <div style={{ ...S.targetValue, color: backoffBeaten ? '#4CAF50' : '#FF5252' }}>
                {targetBackoff.weight}<span style={S.targetUnit}>kg</span> × {targetBackoff.reps}
              </div>
              {backoffBeaten ? (
                <div style={S.targetStatus}>Bugün en iyi back-off: <span style={{ color: '#4CAF50', fontWeight: 800 }}>{todayBestBackoff.weight}kg × {todayBestBackoff.reps}</span> 🔥</div>
              ) : todayBestBackoff ? (
                <div style={S.targetStatus}>Bugün en iyi back-off: {todayBestBackoff.weight}kg × {todayBestBackoff.reps}</div>
              ) : (
                <div style={S.targetStatus}>Şimdi back-off set'i yap, geçen seferki seviyeyi geç</div>
              )}
            </>
          ) : (
            <>
              <div style={{ ...S.targetLabel, marginTop: 12 }}>İLK BACK-OFF</div>
